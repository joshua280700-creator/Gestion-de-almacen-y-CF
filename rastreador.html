<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Rastreador</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --info: #17a2b8; --success: #28a745; --danger: #dc3545;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; max-width: 800px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px;}
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .search-box button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background-color: #153a5c; }
        
        .result-card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 20px; display: none; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .data-group { background: white; padding: 10px; border-radius: 6px; border-left: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .data-group label { display: block; font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }
        .data-group span { font-size: 16px; font-weight: bold; color: #333; }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; color: white; margin-top: 5px;}
        .bg-recibido { background-color: var(--info); }
        .bg-almacenado { background-color: var(--success); }
        .bg-pt { background-color: var(--danger); }

        /* ESTILO DEL BOTÓN DE CERRAR SESIÓN FLOTANTE */
        .logout-btn {
            position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000;
        }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<!-- CANDADO DE SEGURIDAD DIRECTIVOS/ADMIN -->
<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    
    // Solo Admin y Directivos pueden entrar aquí
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== "Directivos")) { 
        window.location.href = "login.html"; 
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol === "Directivos") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                // Ocultar todo lo que NO sea Dashboard o Rastreador
                if(txt !== "Dashboard" && txt !== "Rastreador") {
                    btn.style.display = 'none';
                }
            });
        }
        
        // Botón flotante
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn active">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <h2>🔍 Trazabilidad de Inventario</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ingresa el Folio Master (Ej. 7084C-1)" autocomplete="off">
        <button onclick="buscarFolio()">Buscar Tarima</button>
    </div>

    <div id="loadingMsg" style="display:none; text-align:center; font-weight:bold; color:var(--info);">Consultando base de datos...</div>
    <div id="errorMsg" style="display:none; text-align:center; font-weight:bold; color:var(--danger);">Folio no encontrado.</div>

    <div class="result-card" id="resultCard">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #ddd; padding-bottom:10px;">
            <h3 style="margin:0; color:var(--primary);">Folio: <span id="resFolio"></span></h3>
            <span id="resEstatus" class="status-badge"></span>
        </div>
        
        <div class="result-grid">
            <div class="data-group"><label>Producto</label><span id="resProducto"></span></div>
            <div class="data-group"><label>Peso Neto</label><span id="resPeso"></span> kg</div>
            <div class="data-group"><label>Cuarto Frío</label><span id="resCuarto"></span></div>
            <div class="data-group"><label>Ubicación Física</label><span id="resUbi"></span></div>
        </div>

        <h4 style="margin-top:20px; margin-bottom:10px; color:#555; border-bottom:1px solid #ccc;">Firma de Operadores</h4>
        <div class="result-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr; margin-top:0;">
            <div class="data-group" style="border-left-color:#17a2b8;"><label>Recibió</label><span id="resRecibio" style="font-size:14px;">-</span></div>
            <div class="data-group" style="border-left-color:#28a745;"><label>Ubicó</label><span id="resUbico" style="font-size:14px;">-</span></div>
            <div class="data-group" style="border-left-color:#ffc107;"><label>Ajustó</label><span id="resAjusto" style="font-size:14px;">-</span></div>
            <div class="data-group" style="border-left-color:#dc3545;"><label>Despachó</label><span id="resDespacho" style="font-size:14px;">-</span></div>
        </div>
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') buscarFolio();
    });

    function buscarFolio() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        if(!query) return;

        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('loadingMsg').style.display = 'block';

        fetch(urlGoogleScript + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingMsg').style.display = 'none';
                const tarima = data.find(item => String(item.folio).toUpperCase() === query);
                
                if(tarima) {
                    mostrarResultados(tarima);
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }).catch(err => {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('errorMsg').innerText = "Error de conexión.";
                document.getElementById('errorMsg').style.display = 'block';
            });
    }

    function mostrarResultados(item) {
        document.getElementById('resFolio').innerText = item.folio;
        document.getElementById('resProducto').innerText = item.producto;
        document.getElementById('resPeso').innerText = item.pesoNeto;
        document.getElementById('resCuarto').innerText = item.cuarto || "Sin asignar";
        document.getElementById('resUbi').innerText = item.ubicacion || "En zona de recepción";
        
        document.getElementById('resRecibio').innerText = item.recibio || "-";
        document.getElementById('resUbico').innerText = item.ubico || "-";
        document.getElementById('resAjusto').innerText = item.ajusto || "-";
        document.getElementById('resDespacho').innerText = item.despacho || "-";

        const badge = document.getElementById('resEstatus');
        badge.innerText = item.estatus;
        badge.className = "status-badge"; 
        if(item.estatus === "Recibido") badge.classList.add("bg-recibido");
        if(item.estatus === "Almacenado") badge.classList.add("bg-almacenado");
        if(item.estatus === "PT") badge.classList.add("bg-pt");

        document.getElementById('resultCard').style.display = 'block';
    }
</script>
</body>
</html>
