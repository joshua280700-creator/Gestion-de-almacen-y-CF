<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Rastreador</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --info: #17a2b8; --rack-green: #548235; --danger: #dc3545; --success: #28a745;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; max-width: 1000px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;}
        .search-box button { background-color: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight:bold; font-size: 16px;}
        .result-card { margin-top: 15px; padding: 15px; background-color: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; display: none; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
        .bg-recibido { background-color: #ffc107; color: #333;} .bg-almacenado { background-color: #28a745; } .bg-produccion { background-color: #dc3545; }
        .controls select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; font-size: 15px;}
        
        .racks-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px;}
        .rack-wrapper { border: 1px solid #eee; border-radius: 8px; padding: 15px; background-color: #fafafa; overflow-x: auto;}
        .rack-wrapper h4 { margin-top: 0; margin-bottom: 10px; color: var(--primary); font-size: 16px; border-bottom: 2px solid var(--rack-green); padding-bottom: 5px;}
        .rack-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 600px;}
        .rack-table th, .rack-table td { border: 1px solid #ddd; padding: 6px 8px; }
        .level-separator td { background-color: var(--rack-green); color: white; font-weight: bold; text-align: center; }
        .rack-row.empty { background-color: #fff; color: #aaa; text-align: center; }
        .rack-row.filled { background-color: #e8f5e9; border-left: 4px solid var(--rack-green); color: #222;}
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn active">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <div class="panel" style="border-left: 5px solid var(--primary);">
        <h3 style="margin-top:0; color:var(--primary);">🔍 Rastreador de Folios</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ingresa el folio (Ej. 7085C-1)">
            <button onclick="buscarFolio()">Buscar</button>
        </div>
        <div id="resultCard" class="result-card">
            <h4 style="margin:0 0 10px 0;">Folio: <span id="resFolio"></span></h4>
            <p style="margin:5px 0;">Producto: <strong id="resProducto"></strong> | Peso Neto: <strong id="resPeso"></strong></p>
            <hr>
            <p style="margin:5px 0;">Estatus: <span id="resEstatus" class="badge"></span></p>
            <p style="margin:5px 0;">Ubicación: <strong id="resUbicacion"></strong></p>
        </div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0; color:var(--rack-green);">🗺️ Vista General por Cuarto</h3>
        <p style="font-size: 13px; color: #666; margin-top: -10px;">Selecciona un cuarto para visualizar todos sus andenes simultáneamente.</p>
        
        <div class="controls">
            <select id="cuartoFrio">
                <option value="" disabled selected>Selecciona un Cuarto...</option>
                <option value="Cuarto 1">Cuarto 1</option>
                <option value="Cuarto 2">Cuarto 2</option>
                <option value="Cuarto 3">Cuarto 3</option>
                <option value="Cuarto 4">Cuarto 4</option>
                <option value="Cuarto 5">Cuarto 5</option>
            </select>
        </div>
        
        <!-- Aquí se inyectarán las 5 tablas dinámicamente -->
        <div id="racksContainer" class="racks-container"></div>
        
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbxXRbtug4JByvxMoGSuXMdSMcLgmcYWehX4q3Yb4j3iUixVUjnn4UyU62WDs_RdnLk8Lg/exec";
    let inventarioGlobal = [];
    
    window.addEventListener('load', () => { 
        fetch(urlGoogleScript + "?t=" + new Date().getTime())
        .then(r => r.json())
        .then(d => inventarioGlobal = d); 
    });

    function buscarFolio() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        if (!query) return;
        
        const res = inventarioGlobal.filter(i => String(i.folio).toUpperCase() === query);
        const c = document.getElementById('resultCard'); 
        c.style.display = 'block';
        
        if (res.length > 0) {
            const t = res[res.length - 1];
            document.getElementById('resFolio').innerText = t.folio; 
            document.getElementById('resProducto').innerText = t.producto;
            document.getElementById('resPeso').innerText = t.pesoNeto + " kg";
            
            const badge = document.getElementById('resEstatus'); 
            badge.innerText = t.estatus; 
            badge.className = 'badge';
            
            if (t.estatus === "Recibido") badge.classList.add("bg-recibido"); 
            else if (t.estatus === "Almacenado") badge.classList.add("bg-almacenado"); 
            else if (t.estatus === "PT") badge.classList.add("bg-produccion"); 
            
            document.getElementById('resUbicacion').innerText = t.estatus === "Recibido" ? "Área de Recepción" : (t.estatus === "PT" ? "Salió a PT (Producto Terminado)" : `${t.cuarto} | ${t.ubicacion}`);
            
            c.style.borderLeft = "5px solid var(--success)";
        } else {
            document.getElementById('resFolio').innerText = query; 
            document.getElementById('resProducto').innerText = "---"; 
            document.getElementById('resPeso').innerText = "---";
            document.getElementById('resEstatus').innerText = "NO ENCONTRADO"; 
            document.getElementById('resEstatus').className = 'badge bg-produccion'; 
            document.getElementById('resUbicacion').innerText = "Verifica que el folio sea correcto.";
            
            c.style.borderLeft = "5px solid var(--danger)";
        }
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') buscarFolio();
    });

    function actualizarMapaGeneral() {
        const c = document.getElementById('cuartoFrio').value; 
        const container = document.getElementById('racksContainer');
        container.innerHTML = ""; // Limpia lo anterior
        
        if (!c) return;
        
        const espacios = ["Espacio 1", "Espacio 2", "Espacio 3", "Espacio 4", "Espacio 5"];
        
        // 1. Dibuja las 5 tablas vacías primero
        espacios.forEach(e => {
            let idTabla = 'tabla-' + e.replace(' ', '');
            let htmlTabla = `
            <div class="rack-wrapper">
                <h4>🗄️ ${e}</h4>
                <table class="rack-table" id="${idTabla}">
                    <thead><tr><th>Folio</th><th>Producto</th><th>Peso</th><th>Caja</th><th>Tarima</th></tr></thead>
                    <tbody>
                        <tr class="level-separator"><td colspan="5">Nivel 3 (Alto)</td></tr>
                        <tr class="rack-row empty" data-level="3" data-depth="4"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="3" data-depth="3"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="3" data-depth="2"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="3" data-depth="1"><td colspan="5">Libre</td></tr>
                        <tr class="level-separator"><td colspan="5">Nivel 2 (Medio)</td></tr>
                        <tr class="rack-row empty" data-level="2" data-depth="4"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="2" data-depth="3"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="2" data-depth="2"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="2" data-depth="1"><td colspan="5">Libre</td></tr>
                        <tr class="level-separator"><td colspan="5">Nivel 1 (Piso)</td></tr>
                        <tr class="rack-row empty" data-level="1" data-depth="4"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="1" data-depth="3"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="1" data-depth="2"><td colspan="5">Libre</td></tr><tr class="rack-row empty" data-level="1" data-depth="1"><td colspan="5">Libre</td></tr>
                    </tbody>
                </table>
            </div>`;
            container.innerHTML += htmlTabla;
        });

        // 2. Busca las tarimas y las inyecta en la tabla que le corresponda
        inventarioGlobal.forEach(item => {
            if (item.estatus === "Almacenado" && item.cuarto === c && item.ubicacion) {
                // Separa "Espacio 1" de "Nivel 1, Pos 1"
                let partes = item.ubicacion.split(" - ");
                if (partes.length === 2) {
                    let nombreEspacio = partes[0];
                    let coordenada = partes[1];
                    const match = coordenada.match(/Nivel (\d+), Pos (\d+)/);
                    
                    if(match && espacios.includes(nombreEspacio)) {
                        let idTabla = 'tabla-' + nombreEspacio.replace(' ', '');
                        let tabla = document.getElementById(idTabla);
                        if(tabla) {
                            let row = tabla.querySelector(`.rack-row[data-level="${match[1]}"][data-depth="${match[2]}"]`);
                            if(row) { 
                                row.className = 'rack-row filled'; 
                                row.innerHTML = `<td>${item.folio}</td><td>${item.producto}</td><td>${item.pesoNeto}kg</td><td>${item.tipoCaja}</td><td>${item.tarima}</td>`; 
                            }
                        }
                    }
                }
            }
        });
    }
    
    document.getElementById('cuartoFrio').addEventListener('change', actualizarMapaGeneral); 
</script>
</body>
</html>
