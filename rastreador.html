<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Rastreador</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --info: #17a2b8; --success: #28a745; --danger: #dc3545; --rack-green: #548235; --warning: #ffc107;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; max-width: 900px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px;}
        
        .layout-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .layout-grid { grid-template-columns: 1fr; } }
        
        /* Sección Izquierda: Buscador */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-direction: column;}
        .search-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box;}
        .search-box button { background-color: var(--primary); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; width: 100%;}
        .search-box button:hover { background-color: #153a5c; }
        
        .result-card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; display: none; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .data-group { background: white; padding: 8px; border-radius: 6px; border-left: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .data-group label { display: block; font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; }
        .data-group span { font-size: 14px; font-weight: bold; color: #333; }
        
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; color: white; margin-top: 5px;}
        .bg-recibido { background-color: var(--info); } .bg-almacenado { background-color: var(--success); } .bg-pt { background-color: var(--danger); }

        /* Sección Derecha: Mapa de Racks */
        .rack-map-section { border-left: 1px solid #eee; padding-left: 20px; overflow-x: auto; }
        .form-group { margin-bottom: 10px; } 
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--primary);}
        .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .rack-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; margin-top: 10px;}
        .rack-table th, .rack-table td { border: 1px solid #ddd; padding: 6px 4px; } .rack-table th { background-color: #f9f9f9; }
        .level-separator td { background-color: var(--rack-green); color: white; font-weight: bold; text-align: center; }
        .rack-row { height: 35px; } 
        .rack-row.empty { background-color: #fff; }
        .rack-row.filled { background-color: #f9f9f9; color: #555; }
        .rack-row.highlighted td { background-color: #fff3cd; border-top: 2px solid var(--warning); border-bottom: 2px solid var(--warning); font-weight:bold; color:#000;}

        /* Botón de Cerrar Sesión Flotante */
        .logout-btn {
            position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000;
        }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<!-- CANDADO DE SEGURIDAD DIRECTIVOS/ADMIN -->
<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== "Directivos")) { 
        window.location.href = "login.html"; 
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol === "Directivos") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                if(txt !== "Dashboard" && txt !== "Rastreador") {
                    btn.style.display = 'none';
                }
            });
        }
        
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn active">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <h2>🔍 Trazabilidad de Inventario</h2>
    
    <div id="loadingMsg" style="text-align:center; font-weight:bold; color:var(--info); margin-bottom:15px;">Sincronizando base de datos...</div>
    
    <div class="layout-grid">
        
        <!-- COLUMNA IZQUIERDA: Buscador Rápido -->
        <div>
            <div class="search-box">
                <label style="font-weight:bold; font-size:14px; color:var(--primary);">Búsqueda por Folio:</label>
                <input type="text" id="searchInput" placeholder="Ej. 7084C-1" autocomplete="off">
                <button onclick="buscarFolio()">Buscar Tarima</button>
            </div>

            <div id="errorMsg" style="display:none; text-align:center; font-weight:bold; color:var(--danger); margin-bottom:10px;">Folio no encontrado.</div>

            <div class="result-card" id="resultCard">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #ddd; padding-bottom:5px;">
                    <h3 style="margin:0; color:var(--primary);">Folio: <span id="resFolio"></span></h3>
                    <span id="resEstatus" class="status-badge"></span>
                </div>
                
                <div class="result-grid">
                    <div class="data-group"><label>Producto</label><span id="resProducto"></span></div>
                    <div class="data-group"><label>Peso Neto</label><span id="resPeso"></span> kg</div>
                    <div class="data-group"><label>Cuarto Frío</label><span id="resCuarto"></span></div>
                    <div class="data-group"><label>Ubicación</label><span id="resUbi"></span></div>
                </div>

                <h4 style="margin-top:15px; margin-bottom:5px; color:#555; border-bottom:1px solid #ccc; font-size:12px;">Firmas Operativas</h4>
                <div class="result-grid" style="grid-template-columns: 1fr 1fr; margin-top:0;">
                    <div class="data-group" style="border-left-color:#17a2b8;"><label>Recibió</label><span id="resRecibio" style="font-size:12px;">-</span></div>
                    <div class="data-group" style="border-left-color:#28a745;"><label>Ubicó</label><span id="resUbico" style="font-size:12px;">-</span></div>
                    <div class="data-group" style="border-left-color:#ffc107;"><label>Ajustó</label><span id="resAjusto" style="font-size:12px;">-</span></div>
                    <div class="data-group" style="border-left-color:#dc3545;"><label>Despachó</label><span id="resDespacho" style="font-size:12px;">-</span></div>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: Mapa de Racks -->
        <div class="rack-map-section">
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label>Filtro: Cuarto Frío</label>
                    <select id="cuartoFrio">
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Cuarto 1">Cuarto 1 (Terminado)</option>
                        <option value="Cuarto 2">Cuarto 2 (General)</option>
                        <option value="Cuarto 3">Cuarto 3 (General)</option>
                        <option value="Cuarto 4">Cuarto 4 (General)</option>
                        <option value="Cuarto 5">Cuarto 5 (Tomatillo)</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Filtro: Carril</label>
                    <select id="espacioRack">
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Carril 1">Carril 1</option>
                        <option value="Carril 2">Carril 2</option>
                        <option value="Carril 3">Carril 3</option>
                        <option value="Carril 4">Carril 4</option>
                        <option value="Carril 5">Carril 5</option>
                    </select>
                </div>
            </div>

            <h3 id="rackTitle" style="color:var(--primary); margin-top:5px; margin-bottom:5px; font-size:15px;">Vista General de Rack</h3>
            <table class="rack-table" id="rackTable">
                <thead><tr><th>Folio</th><th>Producto</th><th>P. Neto</th><th>Caja</th><th>Tarima</th></tr></thead>
                <tbody>
                    <tr class="level-separator"><td colspan="5">Nivel 3 (Alto)</td></tr>
                    <tr class="rack-row empty" data-level="3" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr class="level-separator"><td colspan="5">Nivel 2 (Medio)</td></tr>
                    <tr class="rack-row empty" data-level="2" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr class="level-separator"><td colspan="5">Nivel 1 (Piso)</td></tr>
                    <tr class="rack-row empty" data-level="1" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";
    let inventarioGlobal = [];

    window.addEventListener('load', () => {
        fetch(urlGoogleScript + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                inventarioGlobal = data;
                document.getElementById('loadingMsg').style.display = 'none';
            })
            .catch(err => {
                document.getElementById('loadingMsg').innerText = "Error al conectar con la base de datos.";
                document.getElementById('loadingMsg').style.color = "red";
            });
    });

    document.getElementById('cuartoFrio').addEventListener('change', actualizarTablaMapa);
    document.getElementById('espacioRack').addEventListener('change', actualizarTablaMapa);

    function actualizarTablaMapa(folioResaltar = null) {
        const c = document.getElementById('cuartoFrio').value; 
        const e = document.getElementById('espacioRack').value;
        const tituloRack = document.getElementById('rackTitle');
        
        if(e) tituloRack.innerText = "Vista de Rack - " + e; else tituloRack.innerText = "Vista General de Rack";
        
        // Limpiar tabla
        document.querySelectorAll('.rack-row').forEach(row => { 
            row.className = 'rack-row empty'; 
            const tds = row.querySelectorAll('td'); 
            for(let i=0; i<5; i++) tds[i].innerText = ""; 
        });
        
        if (!c || !e) return;

        inventarioGlobal.forEach(item => {
            if (item.estatus === "Almacenado" && item.cuarto === c && item.ubicacion && item.ubicacion.startsWith(e)) {
                const match = item.ubicacion.match(/Nivel (\d+), Pos (\d+)/);
                if(match) {
                    const row = document.querySelector(`.rack-row[data-level="${match[1]}"][data-depth="${match[2]}"]`);
                    if(row) {
                        row.className = 'rack-row filled'; 
                        if (folioResaltar && String(item.folio).toUpperCase() === folioResaltar) {
                            row.classList.add('highlighted');
                        }
                        const tds = row.querySelectorAll('td');
                        tds[0].innerText = item.folio; 
                        tds[1].innerText = item.producto; 
                        tds[2].innerText = item.pesoNeto; 
                        tds[3].innerText = item.tipoCaja; 
                        tds[4].innerText = item.tarima;
                    }
                }
            }
        });
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') buscarFolio();
    });

    function buscarFolio() {
        const query = document.getElementById('searchInput').value.trim().toUpperCase();
        if(!query) return;

        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';

        const tarima = inventarioGlobal.find(item => String(item.folio).toUpperCase() === query);
        
        if(tarima) {
            mostrarResultados(tarima);
            
            // Si está almacenada, cambiar los selectores visuales automáticamente y resaltar
            if(tarima.estatus === "Almacenado" && tarima.cuarto && tarima.ubicacion) {
                document.getElementById('cuartoFrio').value = tarima.cuarto;
                
                // Extraer el carril (Ej: "Carril 3") de la cadena "Carril 3 - Nivel 2, Pos 1"
                const carrilMatch = tarima.ubicacion.split(" - ")[0];
                if(carrilMatch) {
                    document.getElementById('espacioRack').value = carrilMatch;
                    actualizarTablaMapa(query);
                }
            }
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function mostrarResultados(item) {
        document.getElementById('resFolio').innerText = item.folio;
        document.getElementById('resProducto').innerText = item.producto;
        document.getElementById('resPeso').innerText = item.pesoNeto;
        document.getElementById('resCuarto').innerText = item.cuarto || "Sin asignar";
        document.getElementById('resUbi').innerText = item.ubicacion || "En zona de recepción";
        
        document.getElementById('resRecibio').innerText = item.recibio || "-";
        document.getElementById('resUbico').innerText = item.ubico || "-";
        document.getElementById('resAjusto').innerText = item.ajusto || "-";
        document.getElementById('resDespacho').innerText = item.despacho || "-";

        const badge = document.getElementById('resEstatus');
        badge.innerText = item.estatus;
        badge.className = "status-badge"; 
        if(item.estatus === "Recibido") badge.classList.add("bg-recibido");
        if(item.estatus === "Almacenado") badge.classList.add("bg-almacenado");
        if(item.estatus === "PT") badge.classList.add("bg-pt");

        document.getElementById('resultCard').style.display = 'block';
    }
</script>
</body>
</html>
