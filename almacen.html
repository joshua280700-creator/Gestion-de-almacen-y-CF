<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Almacenaje</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --success: #28a745; --danger: #dc3545;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        
        .nav-header { width: 100%; max-width: 500px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; } 
        .form-row { display: flex; gap: 10px; }
        .form-group.half { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box;}
        
        .submit-btn { background-color: var(--success); color: white; border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s ease; margin-top: 15px;}
        .submit-btn:hover { background-color: #218838; }

        .info-box { background: #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: none; border-left: 5px solid var(--primary); }
        .info-box p { margin: 5px 0; font-size: 14px; }
        .info-box span { font-weight: bold; color: var(--primary); }

        .logout-btn { position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000; }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    const rolPermitido = "Almacen";
    
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== rolPermitido)) {
        window.location.href = "login.html";
    }

    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol !== "Admin") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(!btn.classList.contains('active')) btn.style.display = 'none';
            });
        }
        
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn active">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <h2>Asignación a Rack</h2>
    <form id="almacenForm">
        <div class="form-group">
            <label>Escanea el Folio de Tarima</label>
            <input type="text" id="folioEscaneado" required placeholder="Clic aquí y escanea..." autocomplete="off">
        </div>

        <div id="infoTarima" class="info-box">
            <p>Producto: <span id="lblProducto">---</span></p>
            <p>Peso Neto: <span id="lblPeso">---</span> kg</p>
            <p style="color:var(--danger); font-size:12px;" id="msgError"></p>
        </div>

        <div class="form-group">
            <label>Cuarto Frío</label>
            <select id="cuarto" required disabled>
                <option value="" disabled selected>Selecciona Cuarto...</option>
                <option value="Cuarto 1">Cuarto 1 (Terminado) - 6 Carriles</option>
                <option value="Cuarto 2">Cuarto 2 (General) - 6 Carriles</option>
                <option value="Cuarto 3">Cuarto 3 (General) - 4 Carriles</option>
                <option value="Cuarto 4">Cuarto 4 (General) - 3 Carriles</option>
                <option value="Cuarto 5">Cuarto 5 (Tomatillo) - 4 Carriles</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label>Carril</label>
                <select id="espacio" required disabled>
                    <option value="" disabled selected>---</option>
                </select>
            </div>
            <div class="form-group half">
                <label>Nivel</label>
                <select id="nivel" required disabled>
                    <option value="" disabled selected>---</option>
                    <option value="3">Nivel 3 (Alto)</option>
                    <option value="2">Nivel 2 (Medio)</option>
                    <option value="1">Nivel 1 (Piso)</option>
                    <option value="0">Nivel 0 (Frente Rack)</option>
                </select>
            </div>
            <div class="form-group half">
                <label>Posición</label>
                <select id="posicion" required disabled>
                    <option value="" disabled selected>---</option>
                </select>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="btnGuardar" disabled>💾 Confirmar Ubicación</button>
    </form>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";
    let inventarioActivo = [];

    // Limites de carriles por cuarto
    const configCarriles = { "Cuarto 1": 6, "Cuarto 2": 6, "Cuarto 3": 4, "Cuarto 4": 3, "Cuarto 5": 4 };

    window.addEventListener('load', () => {
        fetch(urlGoogleScript + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => { inventarioActivo = data; })
            .catch(error => { alert("Error al conectar con la base de datos."); });
    });

    document.getElementById('folioEscaneado').addEventListener('change', function() {
        const folioBuscado = this.value.trim().toUpperCase();
        if(!folioBuscado) return;

        const tarimaEncontrada = inventarioActivo.find(item => String(item.folio).toUpperCase() === folioBuscado);
        const infoBox = document.getElementById('infoTarima');
        const msgError = document.getElementById('msgError');

        if(tarimaEncontrada) {
            infoBox.style.display = 'block';
            document.getElementById('lblProducto').innerText = tarimaEncontrada.producto;
            document.getElementById('lblPeso').innerText = tarimaEncontrada.pesoNeto;

            if(tarimaEncontrada.estatus !== "Recibido") {
                msgError.innerText = `Esta tarima no está en Andén. Estado actual: ${tarimaEncontrada.estatus}`;
                document.getElementById('cuarto').disabled = true;
                document.getElementById('btnGuardar').disabled = true;
            } else {
                msgError.innerText = "";
                document.getElementById('cuarto').disabled = false;
                document.getElementById('btnGuardar').disabled = false;
            }
        } else {
            infoBox.style.display = 'block';
            document.getElementById('lblProducto').innerText = "---";
            document.getElementById('lblPeso').innerText = "---";
            msgError.innerText = "Folio no encontrado. Verifica que esté registrado.";
            document.getElementById('cuarto').disabled = true;
            document.getElementById('btnGuardar').disabled = true;
        }
    });

    // Control lógico de Carriles dependiendo del Cuarto
    document.getElementById('cuarto').addEventListener('change', function() {
        const c = this.value;
        const selectCarril = document.getElementById('espacio');
        
        selectCarril.innerHTML = '<option value="" disabled selected>---</option>';
        if(configCarriles[c]) {
            for(let i = 1; i <= configCarriles[c]; i++) {
                selectCarril.innerHTML += `<option value="Carril ${i}">Carril ${i}</option>`;
            }
            selectCarril.disabled = false;
        }
    });

    // Habilitar Niveles solo si el Carril está lleno
    document.getElementById('espacio').addEventListener('change', function() {
        document.getElementById('nivel').disabled = false;
    });

    // Control lógico de Posiciones dependiendo del Nivel
    document.getElementById('nivel').addEventListener('change', function() {
        const n = this.value;
        const selectPosicion = document.getElementById('posicion');
        selectPosicion.innerHTML = '<option value="" disabled selected>---</option>';
        
        if (n === "0") {
            // Frente al rack solo tiene 2 posiciones
            selectPosicion.innerHTML += `<option value="1">Pos 1</option>`;
            selectPosicion.innerHTML += `<option value="2">Pos 2</option>`;
        } else if (n === "1" || n === "2" || n === "3") {
            // Rack normal tiene 4 posiciones
            for(let i = 1; i <= 4; i++) {
                selectPosicion.innerHTML += `<option value="${i}">Pos ${i}</option>`;
            }
        }
        selectPosicion.disabled = false;
    });

    document.getElementById('almacenForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.innerText = "⏳ Guardando...";

        const datosAlmacenaje = {
            action: "update_location",
            folio: document.getElementById('folioEscaneado').value.trim().toUpperCase(),
            cuarto: document.getElementById('cuarto').value,
            espacio: document.getElementById('espacio').value,
            level: document.getElementById('nivel').value,
            depth: document.getElementById('posicion').value,
            operador: sesion.nombre 
        };

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosAlmacenaje)
        })
        .then(() => {
            alert("¡Ubicación guardada con éxito!");
            window.location.reload(); 
        })
        .catch(error => {
            alert("Error al guardar. Intenta de nuevo.");
            btn.disabled = false;
            btn.innerText = "💾 Confirmar Ubicación";
        });
    });
</script>
</body>
</html>
