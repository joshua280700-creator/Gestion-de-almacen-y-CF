<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Almacenaje</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --success: #28a745; --rack-green: #548235; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .offline-banner { width: 100%; max-width: 900px; background-color: var(--danger); color: white; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; justify-content: space-between; align-items: center; box-sizing: border-box;}
        .sync-btn { background-color: white; color: var(--danger); border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .nav-header { width: 100%; max-width: 900px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        
        .container { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1.8fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .scan-section { display: flex; flex-direction: column; gap: 15px; }
        #reader-container { width: 100%; border-radius: 8px; overflow: hidden; background-color: #000; } #reader { width: 100%; }
        .form-group { margin-bottom: 10px; } label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .submit-btn { background-color: var(--success); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        .submit-btn:disabled { background-color: #999; cursor: not-allowed; }
        
        .rack-map-section { border-left: 1px solid #eee; padding-left: 20px; overflow-x: auto; }
        .rack-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .rack-table th, .rack-table td { border: 1px solid #ddd; padding: 8px 5px; } .rack-table th { background-color: #f9f9f9; }
        .level-separator td { background-color: var(--rack-green); color: white; font-weight: bold; text-align: center; }
        
        .rack-row.empty { cursor: pointer; height: 35px; } .rack-row.empty:hover { background-color: #f0f8ff; }
        .rack-row.selected td { background-color: #e8f5e9; border-top: 2px solid var(--success); border-bottom: 2px solid var(--success); }
        .rack-row.filled { background-color: #f9f9f9; cursor: not-allowed; color: #555; }
        #status-area { margin-top: 20px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="offlineBanner" class="offline-banner">
    <span id="offlineText">⚠️ Sin conexión: 0 ubicaciones pendientes</span>
    <button class="sync-btn" onclick="sincronizarDatos()">Sincronizar</button>
</div>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn active">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <div class="scan-section">
        <div id="reader-container"><div id="reader"></div></div>
        
        <form id="almacenForm">
            <div class="form-group">
                <label>Folio (Escanear o teclear)</label>
                <input type="text" id="folioDisplay" placeholder="Ej. 7084C-1" required>
            </div>
            
            <div class="form-group">
                <label>1. Cuarto Frío</label>
                <select id="cuartoFrio" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="Cuarto 1">Cuarto 1 (Terminado)</option>
                    <option value="Cuarto 2">Cuarto 2 (General)</option>
                    <option value="Cuarto 3">Cuarto 3 (General)</option>
                    <option value="Cuarto 4">Cuarto 4 (General)</option>
                    <option value="Cuarto 5">Cuarto 5 (Tomatillo)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>2. Carril</label>
                <select id="espacioRack" required>
                    <option value="" disabled selected>Selecciona Carril...</option>
                    <option value="Carril 1">Carril 1</option>
                    <option value="Carril 2">Carril 2</option>
                    <option value="Carril 3">Carril 3</option>
                    <option value="Carril 4">Carril 4</option>
                    <option value="Carril 5">Carril 5</option>
                </select>
            </div>
            
            <input type="hidden" id="levelSelected">
            <input type="hidden" id="depthSelected">
            <button type="submit" id="saveBtn" class="submit-btn" disabled>Confirmar Ubicación</button>
        </form>
    </div>

    <div class="rack-map-section">
        <h2 id="rackTitle" style="color:var(--primary); margin-top:0;">Vista de Rack</h2>
        <p style="font-size:11px; margin-top:-10px; color: #666;">Selecciona una fila vacía para asignar.</p>
        
        <table class="rack-table" id="rackTable">
            <thead><tr><th>Folio</th><th>Producto</th><th>Peso neto</th><th>Caja</th><th>Tarima</th></tr></thead>
            <tbody>
                <tr class="level-separator"><td colspan="5">Nivel 3 (Alto)</td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                
                <tr class="level-separator"><td colspan="5">Nivel 2 (Medio)</td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                
                <tr class="level-separator"><td colspan="5">Nivel 1 (Piso)</td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>
</div>
<div id="status-area"></div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwHM9dAeRsDsr4nMhlTWqTKPjse90wgcVu0wj81ogE-6EsrcTiXlDv-ldZY-kPUp5gFrQ/exec";
    let inventarioGlobal = [];
    let buzonsalida = JSON.parse(localStorage.getItem('wms_almacen_offline')) || [];

    window.addEventListener('load', () => { 
        iniciarCamara(); 
        cargarInventario(); 
        actualizarInterfazOffline();
    });

    function actualizarInterfazOffline() {
        const banner = document.getElementById('offlineBanner');
        if (buzonsalida.length > 0) {
            banner.style.display = 'flex';
            document.getElementById('offlineText').innerText = `⚠️ Sin conexión: ${buzonsalida.length} ubicaciones pendientes`;
        } else {
            banner.style.display = 'none';
        }
    }

    window.addEventListener('online', sincronizarDatos);

    async function sincronizarDatos() {
        if (buzonsalida.length === 0) return;
        if (!navigator.onLine) { alert("Aún no tienes conexión a internet estable."); return; }

        document.getElementById('offlineText').innerText = "🔄 Sincronizando datos...";
        let pendientes = [];

        for (let i = 0; i < buzonsalida.length; i++) {
            try {
                await fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buzonsalida[i]) });
            } catch (error) {
                pendientes.push(buzonsalida[i]);
            }
        }
        buzonsalida = pendientes;
        localStorage.setItem('wms_almacen_offline', JSON.stringify(buzonsalida));
        actualizarInterfazOffline();
        if (buzonsalida.length === 0) { cargarInventario(); } // Recarga mapa al terminar
    }

    function cargarInventario() {
        fetch(urlGoogleScript + "?t=" + new Date().getTime())
        .then(res => res.json()).then(data => {
            inventarioGlobal = data; 
            actualizarTablaMapa();
        }).catch(error => { console.log("Cargando con caché local"); });
    }

    function actualizarTablaMapa() {
        const c = document.getElementById('cuartoFrio').value; 
        const e = document.getElementById('espacioRack').value;
        const tituloRack = document.getElementById('rackTitle');
        if(e) tituloRack.innerText = "Vista de Rack - " + e;
        else tituloRack.innerText = "Vista de Rack";
        
        document.querySelectorAll('.rack-row').forEach(row => {
            row.className = 'rack-row empty'; 
            const tds = row.querySelectorAll('td'); for(let i=0; i<5; i++) tds[i].innerText = "";
        });
        
        if (!c || !e) return;
        inventarioGlobal.forEach(item => {
            if (item.estatus === "Almacenado" && item.cuarto === c && item.ubicacion && item.ubicacion.startsWith(e)) {
                const match = item.ubicacion.match(/Nivel (\d+), Pos (\d+)/);
                if(match) {
                    const row = document.querySelector(`.rack-row[data-level="${match[1]}"][data-depth="${match[2]}"]`);
                    if(row) {
                        row.className = 'rack-row filled'; const tds = row.querySelectorAll('td');
                        tds[0].innerText = item.folio; tds[1].innerText = item.producto; tds[2].innerText = item.pesoNeto + " kg"; tds[3].innerText = item.tipoCaja; tds[4].innerText = item.tarima;
                    }
                }
            }
        });
    }

    document.getElementById('cuartoFrio').addEventListener('change', () => { actualizarTablaMapa(); checkForm(); });
    document.getElementById('espacioRack').addEventListener('change', () => { actualizarTablaMapa(); checkForm(); });
    document.getElementById('folioDisplay').addEventListener('input', checkForm);

    document.getElementById('rackTable').addEventListener('click', function(e) {
        const row = e.target.closest('.rack-row');
        if (!row || row.classList.contains('filled')) return;
        document.querySelectorAll('.rack-row').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
        document.getElementById('levelSelected').value = row.getAttribute('data-level');
        document.getElementById('depthSelected').value = row.getAttribute('data-depth');
        checkForm();
    });

    function checkForm() {
        if(document.getElementById('folioDisplay').value.trim() && document.getElementById('levelSelected').value && document.getElementById('espacioRack').value) {
            document.getElementById('saveBtn').disabled = false;
        } else { document.getElementById('saveBtn').disabled = true; }
    }

    const html5QrCode = new Html5Qrcode("reader");
    function iniciarCamara() {
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) { html5QrCode.start({ facingMode: "environment" }, { fps: 30, qrbox: { width: 250, height: 100 } }, text => {
                document.getElementById('folioDisplay').value = text; document.getElementById('reader-container').style.display = 'none'; html5QrCode.stop(); checkForm();
            });}
        }).catch(err => { console.log(err); });
    }

    document.getElementById('almacenForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const datos = {
            action: 'update_location', 
            folio: document.getElementById('folioDisplay').value.trim(), 
            cuarto: document.getElementById('cuartoFrio').value, 
            espacio: document.getElementById('espacioRack').value, 
            level: document.getElementById('levelSelected').value, 
            depth: document.getElementById('depthSelected').value
        };

        // UI Optimista: Simulamos que se guardó rápido para no trabar al operador
        document.getElementById('status-area').innerHTML = "<span style='color:green'>¡Procesando ubicación!</span>";
        
        // Coloreamos la fila seleccionada temporalmente
        const filaActiva = document.querySelector('.rack-row.selected');
        if(filaActiva) {
            filaActiva.className = 'rack-row filled';
            const tds = filaActiva.querySelectorAll('td');
            tds[0].innerText = datos.folio; tds[1].innerText = "Pendiente sync...";
        }

        document.getElementById('almacenForm').reset(); 
        document.getElementById('levelSelected').value = ""; document.getElementById('depthSelected').value = "";
        document.getElementById('saveBtn').disabled = true;

        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(datos) })
        .then(() => {
            document.getElementById('status-area').innerHTML = "<span style='color:green'>¡Ubicación asignada en servidor!</span>";
            cargarInventario(); 
        }).catch(() => {
            buzonsalida.push(datos);
            localStorage.setItem('wms_almacen_offline', JSON.stringify(buzonsalida));
            actualizarInterfazOffline();
            document.getElementById('status-area').innerHTML = "<span style='color:#ffc107'>Ubicación guardada localmente.</span>";
        });
    });
</script>
</body>
</html>
