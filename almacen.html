<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Almacenaje drive-in (Escaner QR Automático)</title>
    <!-- Incluimos la librería jsQR desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --primary: #1F4E78; /* Azul corporativo logístico */
            --background: #f4f7f6;
            --text: #333;
            --success: #28a745;
            --muted: #ddd;
            --form-bg: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- ESTILOS DEL ENCABEZADO (Idéntico a image_8.png) --- */
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }

        .user-info {
            font-size: 14px;
            color: #555;
        }

        .user-info a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        /* ----------------------------------------------------- */

        /* --- ESTILOS DEL CONTENEDOR DE FORMULARIO (image_8.png) --- */
        .wms-card {
            background-color: var(--form-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        /* --------------------------------------------------------- */

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            text-align: left;
        }

        /* --- ESTILOS DE LA CÁMARA (AUTOMÁTICA Y CENTRADA) --- */
        #scanner-container {
            width: 100%;
            height: 300px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Marco de enfoque visual (Círculo de éxito) */
        #scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 4px solid var(--success);
            border-radius: 50%; /* Forma circular para éxito */
            box-sizing: border-box;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.5);
        }
        /* ----------------------------------------------------- */

        /* Campos de texto y selector (Idénticos a image_8.png) */
        textarea#qrInput {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 2px solid var(--muted); 
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            background-color: #fafafa;
        }

        textarea#qrInput.active-scan {
            border-color: var(--success);
            background-color: #fff;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.3);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--muted);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--muted);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Botón de Confirmación Gris (Idéntico a image_8.png) */
        .submit-btn {
            background-color: var(--muted);
            color: #333;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-top: 15px;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #ccc;
        }
        
        .submit-btn:disabled {
            background-color: #eee;
            color: #ccc;
            cursor: not-allowed;
        }

        #status-area {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

    </style>
</head>
<body>

<div class="header">
    <h1>WMS: Ubicación de Almacén</h1>
    <div class="user-info">Joshua0700 | <a href="index.html">Ir a Recepción</a></div>
</div>

<div class="wms-card">
    <form id="almacenForm">
        
        <!-- SECCIÓN DE CÁMARA (AUTOMÁTICA) -->
        <div id="scanner-container">
            <video id="scanner-video" autoplay playsinline></video>
            <div id="scanner-overlay"></div>
        </div>
        <!-- --------------------------------- -->

        <div class="form-group">
            <label for="qrInput">Pegar/Escanear Texto QR Completo</label>
            <textarea id="qrInput" name="qrInput" placeholder="Producto: Papas\nFolio: 7084C\n..."></textarea>
        </div>

        <div class="form-group">
            <label for="folioDisplay">Folio Único Extraído</label>
            <input type="text" id="folioDisplay" name="folioDisplay" readonly placeholder="Esperando escaneo...">
        </div>

        <div class="form-group">
            <label for="cuartoFrio">Seleccionar Cuarto Frío</label>
            <select id="cuartoFrio" name="cuartoFrio" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="Cuarto 1 (Congelado)">Cuarto 1 (Congelado)</option>
                <option value="Cuarto 2 (Refrigerado)">Cuarto 2 (Refrigerado)</option>
                <option value="Pre-enfriado">Pre-enfriado</option>
            </select>
        </div>

        <button type="submit" id="saveBtn" class="submit-btn" disabled>Confirmar Ubicación y Almacenar</button>
    </form>
</div>

<div id="status-area"></div>

<!-- Lógica del Escáner Automático y Formulario -->
<script>
    const video = document.getElementById('scanner-video');
    const canvas = document.createElement('canvas'); // Canvas oculto para procesar frames
    const ctx = canvas.getContext('2d');
    const qrInput = document.getElementById('qrInput');
    const folioDisplay = document.getElementById('folioDisplay');
    const scannerContainer = document.getElementById('scanner-container');
    const saveBtn = document.getElementById('saveBtn');

    let stream = null;
    let isScanning = false;

    // --- FUNCIONES DEL ESCÁNER AUTOMÁTICO ---
    async function startScanning() {
        try {
            // Solicitar acceso a la cámara trasera (si está disponible)
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { ideal: 'environment' } } 
            });
            video.srcObject = stream;
            
            isScanning = true;
            qrInput.placeholder = "Escaneando... Apunta al código QR";
            
            // Iniciar el bucle de detección
            requestAnimationFrame(tick);
        } catch (err) {
            console.error('Error al acceder a la cámara:', err);
            // alert('No se pudo acceder a la cámara. Por favor, revisa los permisos.');
            // Si la cámara falla, el usuario puede pegar manualmente
            qrInput.placeholder = "Cámara no disponible. Pega el texto del QR aquí.";
        }
    }

    function stopScanning() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        isScanning = false;
        qrInput.placeholder = "Producto: Papas\\nFolio: 7084C\\n...";
    }

    // El "tick" del reloj de detección de QR
    function tick() {
        if (!isScanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Ajustar canvas al tamaño del video
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            
            // Dibujar el frame actual en el canvas oculto
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Obtener datos de imagen para jsQR
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // --- DETECCIÓN DE QR ---
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code) {
                // ¡QR detectado!
                const qrText = code.data;
                console.log('QR Detectado:', qrText);
                
                // 1. Escribir el texto completo en el campo de texto
                qrInput.value = qrText;
                
                // 2. Extraer el Folio (7084C) usando Regex
                extractFolio(qrText);
                
                // 3. Detener escaneo para ahorrar batería
                stopScanning();
                
                // Feedback visual breve (borde verde)
                folioDisplay.style.borderColor = var(--success);
                setTimeout(() => { folioDisplay.style.borderColor = ''; }, 2000);
            }
        }
        
        // Continuar el bucle
        requestAnimationFrame(tick);
    }

    // --- LÓGICA DE EXTRACCIÓN DE FOLIO (Regex) ---
    function extractFolio(text) {
        if (!text) {
            folioDisplay.value = "";
            return;
        }

        // Buscamos la línea que empieza con "Folio:" usando Regex
        const regex = /Folio:\s*(\S+)/;
        const match = text.match(regex);

        if (match && match[1]) {
            const folio = match[1];
            folioDisplay.value = folio;
            saveBtn.disabled = false;
        } else {
            folioDisplay.value = "Folio no encontrado en QR";
            folioDisplay.style.borderColor = "red";
            saveBtn.disabled = true;
        }
    }

    // --- EVENT LISTENERS ---
    
    // Iniciar el escáner AUTOMÁTICAMENTE al cargar la página
    window.addEventListener('load', () => {
        startScanning();
    });

    // Escuchar cambios manuales en el campo de texto (respaldo)
    qrInput.addEventListener('input', () => {
        extractFolio(qrInput.value);
    });

    // Enviar formulario (Fase 3: Búsqueda y Actualización)
    form.addEventListener('submit', function(event) {
        event.preventDefault(); 
        const folio = folioDisplay.value;
        const cuarto = document.getElementById('cuartoFrio').value;
        submitBtn = document.getElementById('saveBtn');
        submitBtn.innerText = "Guardando Ubicación...";
        submitBtn.disabled = true;

        // --- IMPORTANTE: PEGA AQUÍ TU URL ACTUALIZADA DEL PASO 1 (Apps Script) ---
        const urlGoogleScript = "AQUI_PEGA_TU_URL_DE_APPS_SCRIPT_ACTUALIZADA";
        // -------------------------------------------------------------------------

        // NOTA: Para buscar y actualizar, debemos indicar que esta es una acción de "update"
        const datos = {
            action: 'update', // Clave para diferenciar de registro nuevo
            folio: folio,
            cuarto: cuarto
        };

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            // feedback visual
            document.getElementById('status-area').style.display = 'block';
            document.getElementById('status-area').innerHTML = `<span style="color:var(--success)">¡Mercancía ${folio} Almacenada con éxito!</span>`;
            form.reset();
            submitBtn.innerText = "Confirmar Ubicación y Almacenar";
            submitBtn.disabled = true;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('status-area').style.display = 'block';
            document.getElementById('status-area').innerHTML = `<span style="color:red">Error al guardar. Revisa la conexión.</span>`;
            submitBtn.innerText = "Confirmar Ubicación y Almacenar";
            submitBtn.disabled = false;
        });
    });

</script>

</body>
</html>
