<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacenaje - Ubicación de Mercancía V5</title>
    <!-- Librería JsBarcode y Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #1F4E78;
            --background: #f4f7f6;
            --text: #333;
            --success: #28a745;
            --warning: #ffc107;
            --muted: #999;
            --rack-green: #548235; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .header h1 { color: var(--primary); margin: 0; font-size: 24px; }
        .user-info { font-size: 14px; color: #555; }

        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 20px;
        }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .scan-section { display: flex; flex-direction: column; gap: 15px; }

        #reader-container {
            width: 100%; border-radius: 8px; overflow: hidden;
            margin-bottom: 15px; background-color: #000;
        }
        #reader { width: 100%; }

        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }

        input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 16px; box-sizing: border-box;
            background-color: #fff;
        }

        .submit-btn {
            background-color: var(--success); color: white; border: none;
            padding: 12px 20px; font-size: 18px; font-weight: bold;
            border-radius: 6px; cursor: pointer; width: 100%;
            transition: background-color 0.3s ease; margin-top: 15px;
        }
        .submit-btn:hover:not(:disabled) { background-color: #218838; }
        .submit-btn:disabled { background-color: #999; cursor: not-allowed; }
        
        #status-area { margin-top: 20px; text-align: center; font-weight: bold; display: none; }

        .rack-map-section {
            border-left: 1px solid #eee; padding-left: 20px; overflow-x: auto; 
        }
        h2.map-title { color: var(--primary); margin-top: 0; font-size: 18px; text-align: center; }

        .rack-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .rack-table th, .rack-table td { border: 1px solid #ddd; padding: 8px 5px; }
        .rack-table th { background-color: #fff; color: var(--text); font-weight: bold; border-bottom: 2px solid var(--primary); }

        .level-separator td {
            background-color: var(--rack-green); color: white; font-weight: bold;
            text-align: center; padding: 4px; border: 1px solid var(--rack-green);
        }

        .rack-row.empty { background-color: #fff; cursor: pointer; height: 35px; }
        .rack-row.empty:hover { background-color: #f0f8ff; }

        .rack-row.selected td {
            background-color: #e8f5e9; border-top: 2px solid var(--success);
            border-bottom: 2px solid var(--success);
        }
        .rack-row.selected td:first-child { border-left: 2px solid var(--success); }
        .rack-row.selected td:last-child { border-right: 2px solid var(--success); }

        .rack-row.filled { background-color: #f9f9f9; color: #333; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <h1>WMS: Ubicación de Almacén (Drive-In)</h1>
    <div class="user-info">Joshua0700 | <a href="index.html">Ir a Recepción</a></div>
</div>

<div class="container">
    <div class="scan-section">
        <div id="reader-container"><div id="reader"></div></div>

        <form id="almacenForm">
            <div class="form-group">
                <label for="qrInput">Escanear Etiqueta (Code 128)</label>
                <input type="text" id="qrInput" name="qrInput" placeholder="Iniciando cámara...">
            </div>

            <div class="form-group">
                <label for="folioDisplay">Folio Extraído</label>
                <input type="text" id="folioDisplay" name="folioDisplay" readonly placeholder="Esperando escaneo...">
            </div>

            <div class="form-group">
                <label for="cuartoFrio">1. Seleccionar Cuarto Frío</label>
                <select id="cuartoFrio" name="cuartoFrio" required>
                    <option value="" disabled selected>Selecciona un Cuarto...</option>
                    <option value="Cuarto 1">Cuarto 1 (Terminado)</option>
                    <option value="Cuarto 2">Cuarto 2 (General)</option>
                    <option value="Cuarto 3">Cuarto 3 (General)</option>
                    <option value="Cuarto 4">Cuarto 4 (General)</option>
                    <option value="Cuarto 5">Cuarto 5 (Tomatillo)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="espacioRack">2. Seleccionar Espacio/Andén</label>
                <select id="espacioRack" name="espacioRack" required>
                    <option value="" disabled selected>Selecciona un Espacio...</option>
                    <option value="Espacio 1">Espacio 1</option>
                    <option value="Espacio 2">Espacio 2</option>
                    <option value="Espacio 3">Espacio 3</option>
                    <option value="Espacio 4">Espacio 4</option>
                    <option value="Espacio 5">Espacio 5</option>
                </select>
            </div>

            <input type="hidden" id="levelSelected" name="levelSelected">
            <input type="hidden" id="depthSelected" name="depthSelected">
            <button type="submit" id="saveBtn" class="submit-btn" disabled>Confirmar Ubicación</button>
        </form>
    </div>

    <!-- TABLA LIMPIA Y AJUSTADA A 4 ESPACIOS DE PROFUNDIDAD -->
    <div class="rack-map-section">
        <h2 class="map-title">Vista de Rack / Andén</h2>
        <p style="font-size: 11px; color: #777; margin-top:-5px; text-align:center;">Selecciona una fila vacía para asignar la ubicación (Fila superior = Fondo del rack).</p>
        
        <table class="rack-table" id="rackTable">
            <thead>
                <tr>
                    <th>Folio</th><th>Producto</th><th>Peso neto</th><th>Tipo de caja</th><th>Tipo de tarima</th>
                </tr>
            </thead>
            <tbody>
                <!-- NIVEL 3 -->
                <tr class="level-separator"><td colspan="5">Nivel 3 (Alto)</td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>

                <!-- NIVEL 2 -->
                <tr class="level-separator"><td colspan="5">Nivel 2 (Medio)</td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>

                <!-- NIVEL 1 -->
                <tr class="level-separator"><td colspan="5">Nivel 1 (Piso)</td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="status-area"></div>

<script>
    const qrInput = document.getElementById('qrInput');
    const folioDisplay = document.getElementById('folioDisplay');
    const saveBtn = document.getElementById('saveBtn');
    const levelInput = document.getElementById('levelSelected');
    const depthInput = document.getElementById('depthSelected');
    const rackTable = document.getElementById('rackTable');
    const form = document.getElementById('almacenForm');

    // ¡URL INSERTADA AQUÍ!
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwuwfwSfBzH_R9UZWkd_nCyECLb8HZJ4kiGeZmhLUz5Ue_GQ9hV0w7IFzLmLADBWgzwbw/exec";
    
    let inventarioGlobal = [];

    window.addEventListener('load', () => {
        iniciarCamara();
        cargarInventario();
    });

    function cargarInventario() {
        const statusArea = document.getElementById('status-area');
        statusArea.style.display = 'block';
        statusArea.innerHTML = `<span style="color:var(--primary)">Cargando inventario desde la base de datos...</span>`;

        fetch(urlGoogleScript + "?t=" + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            inventarioGlobal = data;
            statusArea.style.display = 'none';
            actualizarTablaMapa(); 
        })
        .catch(error => {
            console.error(error);
            statusArea.innerHTML = `<span style="color:red">Error al cargar el inventario. Revisa tu conexión.</span>`;
        });
    }

    function actualizarTablaMapa() {
        const cuartoFrio = document.getElementById('cuartoFrio').value;
        const espacioRack = document.getElementById('espacioRack').value;

        document.querySelectorAll('.rack-row').forEach(row => {
            row.className = 'rack-row empty';
            const tds = row.querySelectorAll('td');
            for(let i=0; i<5; i++) tds[i].innerText = "";
        });

        if (!cuartoFrio || !espacioRack) return;

        inventarioGlobal.forEach(item => {
            if (item.cuarto === cuartoFrio && item.ubicacion && item.ubicacion.startsWith(espacioRack)) {
                const regex = /Nivel (\d+), Pos (\d+)/;
                const match = item.ubicacion.match(regex);
                
                if(match) {
                    const nivel = match[1];
                    const pos = match[2];
                    
                    const row = document.querySelector(`.rack-row[data-level="${nivel}"][data-depth="${pos}"]`);
                    if(row) {
                        row.className = 'rack-row filled'; 
                        const tds = row.querySelectorAll('td');
                        tds[0].innerText = item.folio;
                        tds[1].innerText = item.producto;
                        tds[2].innerText = item.pesoNeto;
                        tds[3].innerText = item.tipoCaja;
                        tds[4].innerText = item.tarima;
                    }
                }
            }
        });
    }

    document.getElementById('cuartoFrio').addEventListener('change', () => {
        actualizarTablaMapa();
        habilitarBotonGuardar();
    });
    document.getElementById('espacioRack').addEventListener('change', () => {
        actualizarTablaMapa();
        habilitarBotonGuardar();
    });

    rackTable.addEventListener('click', function(event) {
        const row = event.target.closest('.rack-row');
        if (!row || row.classList.contains('filled')) return; 

        const rows = document.querySelectorAll('.rack-row');
        rows.forEach(r => r.classList.remove('selected'));
        
        row.classList.add('selected');
        levelInput.value = row.getAttribute('data-level');
        depthInput.value = row.getAttribute('data-depth');

        habilitarBotonGuardar();
    });

    const html5QrCode = new Html5Qrcode("reader");

    function iniciarCamara() {
        qrInput.placeholder = "Buscando cámara...";
        const config = { fps: 30, qrbox: { width: 300, height: 150 } }; 
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let cameraIdToUse = devices[0].id; 
                for (let i = 0; i < devices.length; i++) {
                    let nombre = devices[i].label.toLowerCase();
                    if (nombre.includes("back") || nombre.includes("trasera") || nombre.includes("environment")) {
                        if (!nombre.includes("ultra") && !nombre.includes("macro") && !nombre.includes("wide") && !nombre.includes("0.5")) {
                            cameraIdToUse = devices[i].id;
                            break; 
                        }
                    }
                }
                html5QrCode.start(cameraIdToUse, config, onScanSuccess)
                .catch(() => html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess));
            } else {
                qrInput.placeholder = "Sin cámara. Escribe el Folio.";
            }
        }).catch(err => qrInput.placeholder = "Cámara falló. Escribe manual.");
    }

    function onScanSuccess(decodedText, decodedResult) {
        html5QrCode.stop().then(() => {
            document.getElementById('reader-container').style.display = 'none';
        }).catch(err => console.log(err));
        qrInput.value = decodedText;
        folioDisplay.value = decodedText.trim();
        folioDisplay.style.borderColor = "var(--success)"; 
        habilitarBotonGuardar();
    }

    qrInput.addEventListener('input', () => {
        folioDisplay.value = qrInput.value.trim();
        habilitarBotonGuardar();
    });

    function habilitarBotonGuardar() {
        if (folioDisplay.value && levelInput.value && depthInput.value && document.getElementById('espacioRack').value) {
            saveBtn.disabled = false;
        }
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        const datos = {
            action: 'update_location',
            folio: folioDisplay.value,
            cuarto: document.getElementById('cuartoFrio').value,
            espacio: document.getElementById('espacioRack').value,
            level: levelInput.value,
            depth: depthInput.value
        };

        saveBtn.innerText = "Guardando Ubicación...";
        saveBtn.disabled = true;

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            const statusArea = document.getElementById('status-area');
            statusArea.style.display = 'block';
            statusArea.innerHTML = `<span style="color:var(--success)">¡MERCANCÍA ${datos.folio} ALMACENADA!</span>`;
            
            cargarInventario(); 

            form.reset();
            const rows = document.querySelectorAll('.rack-row');
            rows.forEach(r => r.classList.remove('selected'));
            saveBtn.innerText = "Confirmar Ubicación";
        })
        .catch(error => {
            const statusArea = document.getElementById('status-area');
            statusArea.style.display = 'block';
            statusArea.innerHTML = `<span style="color:red">Error al guardar.</span>`;
            saveBtn.innerText = "Confirmar Ubicación";
        });
    });
</script>
</body>
</html>
