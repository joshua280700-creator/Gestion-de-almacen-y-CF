<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Recepción</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --success: #28a745; --info: #17a2b8; --danger: #dc3545; --warning: #ffc107; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        /* AQUI ESTÁ EL CAMBIO DE CSS PARA CENTRAR EL BANNER */
        .offline-banner { width: 100%; max-width: 650px; background-color: var(--danger); color: white; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; justify-content: center; gap: 20px; align-items: center; box-sizing: border-box;}
        .sync-btn { background-color: white; color: var(--danger); border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        .nav-header { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; } .form-row { display: flex; gap: 10px; } .form-group.third { flex: 1; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .product-btn { background-color: #f8f9fa; border: 2px solid #ddd; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #555; transition: 0.2s; }
        .product-btn:hover { border-color: var(--primary); }
        .product-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(31, 78, 120, 0.3); }
        .submit-btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s ease; margin-top: 10px;}
        .submit-btn:hover:not(:disabled) { background-color: #153a5c; }
        .reprint-btn { background-color: var(--warning); color: #333; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s ease; margin-top: 10px;}
        .reprint-btn:hover { background-color: #e0a800; }
        #barcode-container { margin-top: 25px; display: none; }
        .print-label { background: white; border: 2px dashed #ccc; border-radius: 8px; width: 10.20cm; height: 5.01cm; margin: 0 auto 20px auto; color: black; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .label-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; border-bottom: 2px solid #000; padding-bottom: 5px; text-transform: uppercase;}
        #barcode { max-width: 100%; max-height: 70%; align-self: center; margin-top: 5px;}
        .action-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .download-btn, .print-btn { color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .download-btn { background-color: var(--success); } .print-btn { background-color: var(--info); }
        @media print { body * { visibility: hidden; } .print-label, .print-label * { visibility: visible; } .print-label { position: absolute; left: 0; top: 0; width: 10.20cm; height: 5.01cm; border: none; padding: 2mm; } @page { size: 10.20cm 5.01cm; margin: 0; } }
        
        .logout-btn {
            position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000;
        }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    const rolPermitido = "Recepcion";
    
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== rolPermitido)) {
        window.location.href = "login.html";
    }

    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol !== "Admin") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(!btn.classList.contains('active')) btn.style.display = 'none';
            });
        }
        
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div id="offlineBanner" class="offline-banner">
    <span id="offlineText">⚠️ Sin conexión: 0 tarimas pendientes</span>
    <button class="sync-btn" onclick="sincronizarDatos()">Sincronizar</button>
</div>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="nav-btn active">Recepción</a>
        <a href="almacen.html" class="nav-btn">Almacenaje</a>
        <a href="salidas.html" class="nav-btn">Salidas</a>
        <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
        <a href="rastreador.html" class="nav-btn">Rastreador</a>
        <a href="dashboard.html" class="nav-btn">Dashboard</a>
    </div>
    
    <h2>Registro de Entrada</h2>
    <form id="registroForm">
        <label>Selecciona el Producto</label>
        <div class="product-grid" id="productGrid">
            <button type="button" class="product-btn" data-val="Serrano">Serrano</button>
            <button type="button" class="product-btn" data-val="Jalapeño">Jalapeño</button>
            <button type="button" class="product-btn" data-val="Poblano">Poblano</button>
            <button type="button" class="product-btn" data-val="Tomatillo C/H">Tomatillo C/H</button>
            <button type="button" class="product-btn" data-val="Tomatillo S/H">Tomatillo S/H</button>
            <button type="button" class="product-btn" data-val="Shishito">Shishito</button>
            <button type="button" class="product-btn" data-val="Anaheim">Anaheim</button>
        </div>
        <input type="hidden" id="producto" required>
        
        <div class="form-row">
            <div class="form-group third"><label>Folio Master</label><input type="number" id="folio" required placeholder="Ej. 7084"></div>
            <div class="form-group third"><label>Certificación</label><select id="certificado" required><option value="C" selected>C - Certificado</option><option value="N">N - No Certificado</option></select></div>
            <div class="form-group third"><label>Tarima #</label><input type="number" id="numeroTarima" min="1" placeholder="Ej. 1"></div>
        </div>

        <!-- Fila 2: Todo lo referente a fechas y pesos globales -->
        <div class="form-row">
            <div class="form-group third">
                <label>Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group third">
                <label>Peso Bruto (kg)</label>
                <input type="number" id="pesoBruto" step="0.01" required>
            </div>
            <div class="form-group third">
                <label>Peso Neto (kg)</label>
                <input type="text" id="pesoNeto" readonly style="background-color: #e9ecef; font-weight: bold; color: var(--success);" placeholder="Auto">
            </div>
        </div>

        <!-- Fila 3: Todo lo referente al empaque físico -->
        <div class="form-row">
            <div class="form-group third">
                <label>Cantidad Cajas</label>
                <input type="number" id="cantidadCajas" min="1" required>
            </div>
            <div class="form-group third">
                <label>Tipo de caja</label>
                <select id="tipoCaja" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="Morelia">Morelia</option>
                    <option value="Naylea">Naylea</option>
                    <option value="Limonera">Limonera</option>
                    <option value="Arpilla">Arpilla</option>
                </select>
            </div>
            <div class="form-group third">
                <label>Tipo de Tarima</label>
                <select id="tipoTarima" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="Tarima azul">Tarima azul</option>
                    <option value="Tarima 2da">Tarima 2da</option>
                </select>
            </div>
        </div>
        
        <button type="submit" class="submit-btn" id="btnGuardar">1️⃣ Registrar y Generar Etiqueta</button>
        <button type="button" class="reprint-btn" id="btnReimprimir">2️⃣ 🔄 Reimprimir Etiqueta (Sin guardar)</button>
    </form>

    <div id="barcode-container">
        <div class="print-label" id="printLabelArea">
            <div class="label-header"><span id="lbl-producto">PRODUCTO</span><span id="lbl-fecha">FECHA</span></div>
            <img id="barcode" />
        </div>
        <div class="action-buttons">
            <button id="printBtn" class="print-btn" type="button">🖨️ Imprimir Etiqueta</button>
            <button id="downloadBtn" class="download-btn" type="button">⬇️ Descargar PNG</button>
        </div>
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";
    let buzonsalida = JSON.parse(localStorage.getItem('wms_recepcion_offline')) || [];
    let ultimoFolioGenerado = "";

    // === CONFIGURACIÓN DE PESOS (TARA) ===
    const pesosCajas = {
        "Morelia": 2.0,
        "Naylea": 0.850,
        "Limonera": 0.780,
        "Arpilla": 0 
    };
    
    const pesosTarimas = {
        "Tarima azul": 23.0,
        "Tarima 2da": 12.0
    };

    function calcularPesoNetoAutomático() {
        let pBruto = parseFloat(document.getElementById('pesoBruto').value) || 0;
        let cantCajas = parseInt(document.getElementById('cantidadCajas').value) || 0;
        let tCaja = document.getElementById('tipoCaja').value;
        let tTarima = document.getElementById('tipoTarima').value;

        let pesoPorCaja = pesosCajas[tCaja] || 0;
        let pesoPorTarima = pesosTarimas[tTarima] || 0;

        if (pBruto > 0 && cantCajas > 0 && tCaja && tTarima) {
            let taraTotal = (cantCajas * pesoPorCaja) + pesoPorTarima;
            let pNetoCalculado = pBruto - taraTotal;
            
            if(pNetoCalculado < 0) pNetoCalculado = 0; 
            
            document.getElementById('pesoNeto').value = pNetoCalculado.toFixed(2);
        } else {
            document.getElementById('pesoNeto').value = "";
        }
    }

    document.getElementById('pesoBruto').addEventListener('input', calcularPesoNetoAutomático);
    document.getElementById('cantidadCajas').addEventListener('input', calcularPesoNetoAutomático);
    document.getElementById('tipoCaja').addEventListener('change', calcularPesoNetoAutomático);
    document.getElementById('tipoTarima').addEventListener('change', calcularPesoNetoAutomático);

    window.onload = function() { 
        document.getElementById('fecha').valueAsDate = new Date(); 
        actualizarInterfazOffline();
    };

    function actualizarInterfazOffline() {
        const banner = document.getElementById('offlineBanner');
        if (buzonsalida.length > 0) {
            banner.style.display = 'flex';
            document.getElementById('offlineText').innerText = `⚠️ Sin conexión: ${buzonsalida.length} tarimas en espera`;
        } else { banner.style.display = 'none'; }
    }

    window.addEventListener('online', sincronizarDatos);

    async function sincronizarDatos() {
        if (buzonsalida.length === 0) return;
        if (!navigator.onLine) { alert("Aún no tienes conexión a internet estable."); return; }

        document.getElementById('offlineText').innerText = "🔄 Sincronizando datos...";
        let pendientes = [];

        for (let i = 0; i < buzonsalida.length; i++) {
            try {
                await fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buzonsalida[i]) });
            } catch (error) { pendientes.push(buzonsalida[i]); }
        }

        buzonsalida = pendientes; 
        localStorage.setItem('wms_recepcion_offline', JSON.stringify(buzonsalida));
        actualizarInterfazOffline();

        if (buzonsalida.length === 0) { alert("¡Todas las tarimas pendientes fueron sincronizadas con éxito!"); }
    }

    document.querySelectorAll('.product-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('producto').value = this.getAttribute('data-val');
        });
    });

    function generarEtiquetaVisual(folioCalculado, productoCalculado, fechaCalculada) {
        ultimoFolioGenerado = folioCalculado;
        document.getElementById('lbl-producto').innerText = productoCalculado;
        document.getElementById('lbl-fecha').innerText = fechaCalculada;
        JsBarcode("#barcode", folioCalculado, { format: "CODE128", width: 3, height: 90, displayValue: true, fontSize: 26, fontOptions: "bold", margin: 10, background: "#ffffff", lineColor: "#000000" });
        document.getElementById('barcode-container').style.display = 'block';
    }

    document.getElementById('registroForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        const productoBase = document.getElementById('producto').value;
        if(!productoBase) { alert("Por favor, selecciona un producto."); return; }
        
        const pBruto = parseFloat(document.getElementById('pesoBruto').value);
        const pNeto = parseFloat(document.getElementById('pesoNeto').value);
        const cantCajasData = parseInt(document.getElementById('cantidadCajas').value) || 0;
        
        if(!pBruto || isNaN(pNeto)) { alert("⚠️ Error: Necesitas ingresar los datos para calcular el peso."); return; }
        if(pNeto <= 0) { alert("⚠️ Error: El Peso Neto calculado es 0 o negativo. Revisa la cantidad de cajas y el peso bruto."); return; }

        const folioBase = document.getElementById('folio').value.trim();
        const certificado = document.getElementById('certificado').value;
        const numTarima = document.getElementById('numeroTarima').value.trim();
        const folioFinal = numTarima ? `${folioBase}${certificado}-${numTarima}` : `${folioBase}${certificado}`;
        const productoFinal = `${productoBase} Original`; 
        const fechaData = document.getElementById('fecha').value;
        
        const datos = {
            producto: productoFinal, 
            folio: folioFinal, 
            pesoBruto: pBruto, 
            pesoNeto: pNeto,
            fecha: fechaData, 
            cantidadCajas: cantCajasData,
            tipoCaja: document.getElementById('tipoCaja').value, 
            tarima: document.getElementById('tipoTarima').value,
            operador: sesion.nombre 
        };

        generarEtiquetaVisual(folioFinal, productoFinal, fechaData);
        
        document.getElementById('pesoBruto').value = ""; 
        document.getElementById('cantidadCajas').value = ""; 
        document.getElementById('pesoNeto').value = "";
        
        if(numTarima !== "") { document.getElementById('numeroTarima').value = parseInt(numTarima) + 1; }
        document.getElementById('pesoBruto').focus();

        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) })
        .then(() => { }).catch(() => {
            buzonsalida.push(datos);
            localStorage.setItem('wms_recepcion_offline', JSON.stringify(buzonsalida));
            actualizarInterfazOffline();
        });
    });

    document.getElementById('btnReimprimir').addEventListener('click', function() {
        const productoBase = document.getElementById('producto').value;
        if(!productoBase) { alert("Selecciona un producto para generar la etiqueta."); return; }
        const folioBase = document.getElementById('folio').value.trim();
        if(!folioBase) { alert("Ingresa el número de folio maestro."); return; }
        
        const certificado = document.getElementById('certificado').value;
        const numTarima = document.getElementById('numeroTarima').value.trim();
        const folioFinal = numTarima ? `${folioBase}${certificado}-${numTarima}` : `${folioBase}${certificado}`;
        const productoFinal = `${productoBase} Original`; 
        const fechaData = document.getElementById('fecha').value;

        generarEtiquetaVisual(folioFinal, productoFinal, fechaData);
        alert(`Etiqueta ${folioFinal} generada en pantalla lista para reimpresión.`);
    });

    document.getElementById('printBtn').addEventListener('click', function() { window.print(); });
    document.getElementById('downloadBtn').addEventListener('click', function() {
        html2canvas(document.getElementById('printLabelArea'), {scale: 2}).then(function(canvas) {
            const link = document.createElement('a'); link.download = `Etiqueta_${ultimoFolioGenerado}.png`; link.href = canvas.toDataURL("image/png"); link.click();
        });
    });
</script>
</body>
</html>
