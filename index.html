<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Recepción y Trazabilidad V3</title>
    <!-- Librería JsBarcode para Códigos de Barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary: #1F4E78;
            --background: #f4f7f6;
            --text: #333;
            --success: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .nav-header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .nav-btn {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-group.half {
            flex: 1;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #153a5c;
        }
        
        .submit-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #barcode-container {
            margin-top: 25px;
            text-align: center;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
            border: 1px dashed #ccc;
            display: none; 
        }

        /* El código de barras se renderiza aquí */
        #barcode {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="almacen.html" class="nav-btn">Ir a Almacenaje</a>
    </div>
    
    <h2>Registro de Entrada</h2>
    <form id="registroForm">
        
        <div class="form-group">
            <label for="producto">Nombre del Producto</label>
            <input type="text" id="producto" name="producto" required placeholder="Ej. Papas">
        </div>

        <div class="form-group">
            <label for="folio">Folio</label>
            <input type="text" id="folio" name="folio" required placeholder="Ej. 7084C">
        </div>

        <div class="form-group">
            <label for="pesoBruto">Peso Bruto (kg)</label>
            <input type="number" id="pesoBruto" name="pesoBruto" step="0.01" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="pesoNeto">Peso Neto (kg)</label>
            <input type="number" id="pesoNeto" name="pesoNeto" step="0.01" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="fecha">Fecha de Recepción</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="tipoCaja">Tipo de caja</label>
                <input type="text" id="tipoCaja" name="tipoCaja" list="tipoCajaList" required placeholder="Ej. Morelia">
                <datalist id="tipoCajaList">
                    <option value="Morelia">
                    <option value="Naylea">
                    <option value="Arpilla">
                    <option value="Madera">
                    <option value="Cartón">
                </datalist>
            </div>

            <div class="form-group half">
                <label for="tipoTarima">Tipo de Tarima</label>
                <select id="tipoTarima" name="tipoTarima" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="Plástico">Plástico</option>
                    <option value="Madera 1ra">Madera 1ra</option>
                    <option value="Madera 2da">Madera 2da</option>
                    <option value="Chep">Chep</option>
                    <option value="Sin Tarima">Sin Tarima</option>
                </select>
            </div>
        </div>

        <button type="submit" class="submit-btn">Registrar y Generar Etiqueta</button>
    </form>

    <div id="barcode-container">
        <h3>Etiqueta Generada</h3>
        <!-- Usamos una etiqueta <img> para que sea fácil de descargar -->
        <img id="barcode" />
        <br>
        <button id="downloadBtn" class="download-btn">Descargar Etiqueta (PNG)</button>
    </div>
</div>

<script>
    window.onload = function() {
        document.getElementById('fecha').valueAsDate = new Date();
    };

    const form = document.getElementById('registroForm');
    const barcodeContainer = document.getElementById('barcode-container');
    const downloadBtn = document.getElementById('downloadBtn');
    
    form.addEventListener('submit', function(event) {
        event.preventDefault(); 

        const submitBtn = document.querySelector('.submit-btn');
        const textoOriginal = submitBtn.innerText;
        submitBtn.innerText = "Registrando en Base de Datos...";
        submitBtn.disabled = true;

        const datos = {
            producto: document.getElementById('producto').value,
            folio: document.getElementById('folio').value,
            pesoBruto: document.getElementById('pesoBruto').value,
            pesoNeto: document.getElementById('pesoNeto').value,
            fecha: document.getElementById('fecha').value,
            tipoCaja: document.getElementById('tipoCaja').value,
            tarima: document.getElementById('tipoTarima').value 
        };

        // IMPORTANTE: RECUERDA PEGAR TU URL DE GOOGLE APPS SCRIPT AQUÍ
        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbxyBJRNzapZgdTOctXgHDKXi7WF3COGMyY4zTOzJZEo81SrhNnoaq4kYDpZYqV7MgVH/exec";

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors', 
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            // GENERACIÓN DEL CÓDIGO DE BARRAS (Code 128)
            // Solo imprimimos el Folio, es lo único que necesita la cámara
            JsBarcode("#barcode", datos.folio, {
                format: "CODE128",
                lineColor: "#000",
                width: 3, // Grosor de las líneas
                height: 100, // Altura de las líneas
                displayValue: true, // Muestra el texto abajo
                fontSize: 24
            });

            barcodeContainer.style.display = 'block';
            
            submitBtn.innerText = textoOriginal;
            submitBtn.disabled = false;
            
            form.reset();
            document.getElementById('fecha').valueAsDate = new Date(); 
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un error al guardar. Revisa tu conexión a internet.");
            submitBtn.innerText = textoOriginal;
            submitBtn.disabled = false;
        });
    });

    downloadBtn.addEventListener('click', function() {
        const img = document.getElementById('barcode');
        const dataUrl = img.src;

        const link = document.createElement('a');
        link.download = `Etiqueta_Folio.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
