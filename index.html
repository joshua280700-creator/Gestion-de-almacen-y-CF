<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Recepción</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --success: #28a745; --info: #17a2b8; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        .nav-header { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; } .form-row { display: flex; gap: 10px; } .form-group.third { flex: 1; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px;}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        
        /* Botonera de Productos */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .product-btn { background-color: #f8f9fa; border: 2px solid #ddd; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #555; transition: 0.2s; }
        .product-btn:hover { border-color: var(--primary); }
        .product-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(31, 78, 120, 0.3); }

        .submit-btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s ease; margin-top: 10px;}
        .submit-btn:hover:not(:disabled) { background-color: #153a5c; } .submit-btn:disabled { background-color: #999; cursor: not-allowed; }
        
        #barcode-container { margin-top: 25px; display: none; }
        
        /* === DISEÑO DE LA ETIQUETA INDUSTRIAL === */
        .print-label { background: white; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; max-width: 400px; margin: 0 auto 20px auto; text-align: center; color: black; }
        .label-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; border-bottom: 3px solid #000; padding-bottom: 8px; margin-bottom: 10px; text-transform: uppercase;}
        .label-peso { font-size: 26px; font-weight: 900; margin-bottom: 15px; }
        .label-caja { font-size: 14px; font-weight: bold; border-top: 2px solid #000; padding-top: 8px; margin-top: 5px; text-transform: uppercase;}
        #barcode { max-width: 100%; height: auto; }
        
        .action-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .download-btn, .print-btn { color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .download-btn { background-color: var(--success); } .download-btn:hover { background-color: #218838; }
        .print-btn { background-color: var(--info); } .print-btn:hover { background-color: #138496; }

        /* MAGIA DE IMPRESIÓN MEJORADA */
        @media print {
            body * { visibility: hidden; } 
            .print-label, .print-label * { visibility: visible; } 
            .print-label { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                max-width: 100mm; /* Adaptado a etiquetadora térmica */
                border: none; /* Quitamos borde punteado al imprimir */
                padding: 0;
            }
            @page { margin: 0; } 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="nav-btn active">Recepción</a>
        <a href="almacen.html" class="nav-btn">Almacenaje</a>
        <a href="salidas.html" class="nav-btn">Salidas</a>
        <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
        <a href="rastreador.html" class="nav-btn">Rastreador</a>
        <a href="dashboard.html" class="nav-btn">Dashboard</a>
    </div>
    
    <h2>Registro de Entrada</h2>
    <form id="registroForm">
        
        <label>Selecciona el Producto</label>
        <div class="product-grid" id="productGrid">
            <button type="button" class="product-btn" data-val="Serrano">Serrano</button>
            <button type="button" class="product-btn" data-val="Jalapeño">Jalapeño</button>
            <button type="button" class="product-btn" data-val="Poblano">Poblano</button>
            <button type="button" class="product-btn" data-val="Tomatillo C/H">Tomatillo C/H</button>
            <button type="button" class="product-btn" data-val="Tomatillo S/H">Tomatillo S/H</button>
            <button type="button" class="product-btn" data-val="Shishito">Shishito</button>
            <button type="button" class="product-btn" data-val="Anaheim">Anaheim</button>
        </div>
        <input type="hidden" id="producto" required>
        
        <div class="form-row">
            <div class="form-group third">
                <label>Folio Master</label>
                <input type="number" id="folio" required placeholder="Ej. 7084">
            </div>
            
            <div class="form-group third">
                <label>Certificación</label>
                <select id="certificado" required>
                    <option value="C" selected>C - Certificado</option>
                    <option value="N">N - No Certificado</option>
                </select>
            </div>

            <div class="form-group third">
                <label>Tarima #</label>
                <input type="number" id="numeroTarima" min="1" placeholder="Ej. 1">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group third"><label>Peso Bruto (kg)</label><input type="number" id="pesoBruto" step="0.01" required></div>
            <div class="form-group third"><label>Peso Neto (kg)</label><input type="number" id="pesoNeto" step="0.01" required></div>
            <div class="form-group third"><label>Fecha</label><input type="date" id="fecha" required></div>
        </div>

        <div class="form-row">
            <div class="form-group third">
                <label>Tipo de caja</label><input type="text" id="tipoCaja" list="tipoCajaList" required>
                <datalist id="tipoCajaList"><option value="Morelia"><option value="Naylea"><option value="Arpilla"><option value="Madera"><option value="Cartón"></datalist>
            </div>
            <div class="form-group third">
                <label>Tipo de Tarima</label>
                <select id="tipoTarima" required>
                    <option value="" disabled selected>Selecciona...</option><option value="Plástico">Plástico</option><option value="Madera 1ra">Madera 1ra</option><option value="Madera 2da">Madera 2da</option><option value="Chep">Chep</option><option value="Sin Tarima">Sin Tarima</option>
                </select>
            </div>
        </div>
        <button type="submit" class="submit-btn">Registrar y Generar Etiqueta</button>
    </form>

    <div id="barcode-container">
        <!-- ETIQUETA INDUSTRIAL COMPLETA -->
        <div class="print-label" id="printLabelArea">
            <div class="label-header">
                <span id="lbl-producto">PRODUCTO</span>
                <span id="lbl-fecha">FECHA</span>
            </div>
            <div class="label-peso">
                P. NETO: <span id="lbl-peso">0.00</span> kg
            </div>
            <!-- Mejoramos calidad del código de barras -->
            <img id="barcode" />
            
            <div class="label-caja">
                Caja: <span id="lbl-caja"></span> | Tarima: <span id="lbl-tarima"></span>
            </div>
        </div>

        <div class="action-buttons">
            <button id="printBtn" class="print-btn" type="button">🖨️ Imprimir Etiqueta</button>
            <button id="downloadBtn" class="download-btn" type="button" style="display:none;">⬇️ Descargar</button>
        </div>
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbxXRbtug4JByvxMoGSuXMdSMcLgmcYWehX4q3Yb4j3iUixVUjnn4UyU62WDs_RdnLk8Lg/exec";

    window.onload = function() { document.getElementById('fecha').valueAsDate = new Date(); };

    document.querySelectorAll('.product-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('producto').value = this.getAttribute('data-val');
        });
    });

    document.getElementById('registroForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        const productoBase = document.getElementById('producto').value;
        if(!productoBase) {
            alert("Por favor, selecciona un producto tocando uno de los botones.");
            return;
        }

        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.innerText = "Registrando..."; submitBtn.disabled = true;

        const folioBase = document.getElementById('folio').value.trim();
        const certificado = document.getElementById('certificado').value;
        const numTarima = document.getElementById('numeroTarima').value.trim();
        
        const folioFinal = numTarima ? `${folioBase}${certificado}-${numTarima}` : `${folioBase}${certificado}`;
        const productoFinal = `${productoBase} Original`; 
        
        const pesoNetoData = document.getElementById('pesoNeto').value;
        const fechaData = document.getElementById('fecha').value;
        const cajaData = document.getElementById('tipoCaja').value;
        const tarimaData = document.getElementById('tipoTarima').value;

        const datos = {
            producto: productoFinal, folio: folioFinal,
            pesoBruto: document.getElementById('pesoBruto').value, pesoNeto: pesoNetoData,
            fecha: fechaData, tipoCaja: cajaData, tarima: tarimaData 
        };

        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) })
        .then(() => {
            
            // LLENAMOS LOS DATOS VISUALES DE LA ETIQUETA
            document.getElementById('lbl-producto').innerText = productoFinal;
            document.getElementById('lbl-fecha').innerText = fechaData;
            document.getElementById('lbl-peso').innerText = pesoNetoData;
            document.getElementById('lbl-caja').innerText = cajaData;
            document.getElementById('lbl-tarima').innerText = tarimaData;

            // MEJORA DE CALIDAD EN EL CÓDIGO DE BARRAS
            // Aumentamos width de 3 a 4, height de 100 a 120, y margin a 15 para la zona de silencio.
            JsBarcode("#barcode", datos.folio, { 
                format: "CODE128", 
                width: 4, 
                height: 120, 
                displayValue: true, 
                fontSize: 30, 
                fontOptions: "bold",
                margin: 15,
                background: "#ffffff",
                lineColor: "#000000"
            });
            
            document.getElementById('barcode-container').style.display = 'block';
            submitBtn.innerText = "Registrar y Generar Etiqueta"; submitBtn.disabled = false;
            
            // Congelamos todo y limpiamos pesos
            document.getElementById('pesoBruto').value = "";
            document.getElementById('pesoNeto').value = "";
            if(numTarima !== "") {
                document.getElementById('numeroTarima').value = parseInt(numTarima) + 1;
            }
            document.getElementById('pesoBruto').focus();
            
        }).catch(() => { alert("Error al guardar."); submitBtn.disabled = false; });
    });

    document.getElementById('printBtn').addEventListener('click', function() {
        window.print();
    });
</script>
</body>
</html>
