<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción y Trazabilidad de Mercancía</title>
    <!-- Incluimos la librería qrcode.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1F4E78;
            --background: #f4f7f6;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #153a5c;
        }
        
        .submit-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        /* Area del QR */
        #qr-container {
            margin-top: 25px;
            text-align: center;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
            border: 1px dashed #ccc;
            display: none; 
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Entrada</h2>
    <form id="registroForm">
        
        <div class="form-group">
            <label for="producto">Nombre del Producto</label>
            <input type="text" id="producto" name="producto" required placeholder="Ej. Serrano original">
        </div>

        <div class="form-group">
            <label for="folio">Folio</label>
            <input type="text" id="folio" name="folio" required placeholder="Ej. 7084C">
        </div>

        <div class="form-group">
            <label for="pesoBruto">Peso Bruto (kg)</label>
            <input type="number" id="pesoBruto" name="pesoBruto" step="0.01" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="pesoNeto">Peso Neto (kg)</label>
            <input type="number" id="pesoNeto" name="pesoNeto" step="0.01" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="fecha">Fecha de Recepción</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form-group">
            <label for="insumo">Insumo de Transporte</label>
            <input type="text" id="insumo" name="insumo" list="insumosList" required placeholder="Selecciona o escribe">
            <datalist id="insumosList">
                <option value="Morelia">
                <option value="Naylea">
                <option value="Arpilla">
                <option value="Caja Plástica">
            </datalist>
        </div>

        <button type="submit" class="submit-btn">Registrar y Generar QR</button>
    </form>

    <!-- Contenedor del QR y Descarga -->
    <div id="qr-container">
        <h3>Código QR Generado</h3>
        <p>Folio: <strong id="folio-display"></strong></p>
        <div id="qrcode"></div>
        <button id="downloadBtn" class="download-btn">Descargar Imagen QR (PNG)</button>
    </div>
</div>

<script>
    window.onload = function() {
        document.getElementById('fecha').valueAsDate = new Date();
    };

    const form = document.getElementById('registroForm');
    const qrContainer = document.getElementById('qr-container');
    const qrcodeElement = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('downloadBtn');
    const folioDisplay = document.getElementById('folio-display');
    
    let qrGenerator = null;

    form.addEventListener('submit', function(event) {
        event.preventDefault(); 

        const submitBtn = document.querySelector('.submit-btn');
        const textoOriginal = submitBtn.innerText;
        submitBtn.innerText = "Registrando en Base de Datos...";
        submitBtn.disabled = true;

        const datos = {
            producto: document.getElementById('producto').value,
            folio: document.getElementById('folio').value,
            pesoBruto: document.getElementById('pesoBruto').value,
            pesoNeto: document.getElementById('pesoNeto').value,
            fecha: document.getElementById('fecha').value,
            insumo: document.getElementById('insumo').value
        };

        const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwuwfwSfBzH_R9UZWkd_nCyECLb8HZJ4kiGeZmhLUz5Ue_GQ9hV0w7IFzLmLADBWgzwbw/exec";

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors', 
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            qrcodeElement.innerHTML = "";
            folioDisplay.innerText = datos.folio;
            
            // --- MODIFICACIÓN PARA GENERAR LA CADENA COMPLETA ---
            // 1. Obtener fecha y hora actual para el inicio de la cadena
            const ahora = new Date();
            const dia = ahora.getDate();
            const mes = ahora.getMonth() + 1; // Los meses empiezan en 0
            const anio = ahora.getFullYear();
            const hora = ahora.getHours().toString().padStart(2, '0') + ':' + 
                         ahora.getMinutes().toString().padStart(2, '0') + ':' + 
                         ahora.getSeconds().toString().padStart(2, '0');
            
            const timestampQR = `${dia}/${mes}/${anio} ${hora}`;

            // 2. Unir toda la información tal cual la pediste
            // Ejemplo de resultado: "17/7/2026 13:59:48Serrano original7084C8997992026-07-17Morelia"
            const textoQrCompleto = `${timestampQR}${datos.producto}${datos.folio}${datos.pesoBruto}${datos.pesoNeto}${datos.fecha}${datos.insumo}`;

            // 3. Generar el QR con la cadena completa
            qrGenerator = new QRCode(qrcodeElement, {
                text: textoQrCompleto,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            // ----------------------------------------------------

            qrContainer.style.display = 'block';
            
            submitBtn.innerText = textoOriginal;
            submitBtn.disabled = false;
            
            form.reset();
            document.getElementById('fecha').valueAsDate = new Date(); 
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un error al guardar. Revisa tu conexión a internet.");
            submitBtn.innerText = textoOriginal;
            submitBtn.disabled = false;
        });
    });

    downloadBtn.addEventListener('click', function() {
        const img = qrcodeElement.querySelector('img');
        const canvas = qrcodeElement.querySelector('canvas');

        let dataUrl;
        
        if (img && img.src) {
            dataUrl = img.src;
        } else if (canvas) {
            dataUrl = canvas.toDataURL("image/png");
        } else {
            alert("No se pudo descargar la imagen. Intenta regenerar el QR.");
            return;
        }

        const link = document.createElement('a');
        const folioTexto = folioDisplay.innerText;
        
        link.download = `QR_${folioTexto}.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
