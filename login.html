<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Rombo - Acceso</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--primary); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        .login-card h2 { margin-top: 0; color: var(--primary); margin-bottom: 5px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        
        .login-btn { background-color: var(--primary); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px; transition: 0.3s;}
        .login-btn:hover { background-color: #153a5c; }
        
        #error-msg { color: var(--danger); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>WMS Rombo</h2>
    <p>Control de Acceso Seguro</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label>Nombre del Operador:</label>
            <input type="text" id="nombreUsuario" placeholder="" required autocomplete="off">
        </div>
        
        <div class="form-group">
            <label>Rol de Acceso:</label>
            <select id="rolUsuario" required>
                <option value="" disabled selected>Selecciona tu área...</option>
                <option value="Admin">Administrador / Captura</option>
                <option value="Recepcion">Recepción</option>
                <option value="Almacen">Almacén</option>
                <option value="Directivos">Directivos</option>
            </select>
        </div>

        <div class="form-group">
            <label>PIN de Seguridad:</label>
            <input type="password" id="pinUsuario" placeholder="****" required autocomplete="off" maxlength="4">
        </div>
        
        <button type="submit" class="login-btn">Ingresar al Sistema</button>
        <div id="error-msg">PIN incorrecto para el rol seleccionado.</div>
    </form>
</div>

<script>
    // 🛡️ BÓVEDA DE HUELLAS DIGITALES (Hashes SHA-256)
    // Los números de PIN reales ya NO existen en este código.
    const HASHES_VALIDOS = {
        "Admin": "a3683a3038676d1a5fa2b2e8fb7a346e96996841b52c0cdadcb0a221f2010834",      // Corresponde a tu PIN Admin
        "Recepcion": "6e7a2b2586b6a22b07e7b6d1927de2262d5e3efbfed3a8c8e1e79cb4d59f6362",  // Corresponde a tu PIN Recepción
        "Almacen": "1c22a316c09b49911e3b6e7fae4eb245131ccb1f28b76ce836a0ed7d6c268884",    // Corresponde a tu PIN Almacén
        "Directivos": "e250e32b0ecb38b33230a133f8beadca275c6d37be5a04eefebc7a40ab7ecbce" // Corresponde a tu PIN Directivos
    };

    // Función matemática para convertir lo que teclean en huella digital
    async function cifrarPIN(pinTexto) {
        const buffer = new TextEncoder().encode(pinTexto);
        const hash = await crypto.subtle.digest('SHA-256', buffer);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.onload = function() {
        const sesionActual = JSON.parse(localStorage.getItem('wms_session'));
        if(sesionActual) {
            redirigirSegunRol(sesionActual.rol);
        }
    };

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombreUsuario').value.trim();
        const rol = document.getElementById('rolUsuario').value;
        const pinIngresado = document.getElementById('pinUsuario').value.trim();
        const errorMsg = document.getElementById('error-msg');

        // Convertimos el PIN ingresado a su versión cifrada
        const hashCalculado = await cifrarPIN(pinIngresado);

        // Comparamos el cifrado contra la bóveda
        if (HASHES_VALIDOS[rol] === hashCalculado) {
            const datosSesion = { nombre: nombre, rol: rol };
            localStorage.setItem('wms_session', JSON.stringify(datosSesion));
            
            errorMsg.style.display = 'none';
            redirigirSegunRol(rol);
        } else {
            errorMsg.style.display = 'block';
            document.getElementById('pinUsuario').value = "";
            document.getElementById('pinUsuario').focus();
        }
    });

    function redirigirSegunRol(rol) {
        if (rol === "Admin" || rol === "Recepcion") {
            window.location.href = "index.html"; 
        } else if (rol === "Almacen") {
            window.location.href = "almacen.html"; 
        } else if (rol === "Directivos") {
            window.location.href = "dashboard.html"; 
        }
    }
</script>
</body>
</html>
