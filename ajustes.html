<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Ajustes y Reubicación</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --warning: #ffc107; --rack-green: #548235; --success: #28a745; --danger: #dc3545;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .offline-banner { width: 100%; max-width: 900px; background-color: var(--danger); color: white; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; justify-content: space-between; align-items: center; box-sizing: border-box;}
        .sync-btn { background-color: white; color: var(--danger); border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .nav-header { width: 100%; max-width: 900px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1.8fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .form-section { display: flex; flex-direction: column; gap: 10px; }
        #reader-container { width: 100%; border-radius: 8px; overflow: hidden; background-color: #000; margin-bottom: 10px;} #reader { width: 100%; }
        label { font-weight: bold; font-size: 13px; margin-bottom: 4px; display: block; color: var(--primary);}
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px;}
        .submit-btn { background-color: var(--warning); color: #333; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px;}
        .submit-btn:disabled { background-color: #ccc; color:#666; cursor: not-allowed; }
        .rack-map-section { border-left: 1px solid #eee; padding-left: 20px; overflow-x: auto; }
        .rack-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .rack-table th, .rack-table td { border: 1px solid #ddd; padding: 8px 5px; } .rack-table th { background-color: #f9f9f9; }
        .level-separator td { background-color: var(--rack-green); color: white; font-weight: bold; text-align: center; }
        .rack-row.empty { cursor: pointer; height: 35px; } .rack-row.empty:hover { background-color: #f0f8ff; }
        .rack-row.selected td { background-color: #fff3cd; border-top: 2px solid var(--warning); border-bottom: 2px solid var(--warning); }
        .rack-row.filled { background-color: #f9f9f9; cursor: not-allowed; color:#888;}
        #status-area { margin-top: 15px; text-align: center; font-weight: bold; }
        
        .logout-btn { position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000; }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    const rolPermitido = "Almacen";
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== rolPermitido)) { window.location.href = "login.html"; }
    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol !== "Admin") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                if(txt !== "Almacenaje" && txt !== "Salidas" && txt !== "Ajustes / Reubicación") btn.style.display = 'none';
            });
        }
        const btnSalir = document.createElement('button'); btnSalir.className = 'logout-btn'; btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => { localStorage.removeItem('wms_session'); window.location.href = "login.html"; }; document.body.appendChild(btnSalir);
    });
</script>

<div id="offlineBanner" class="offline-banner"><span id="offlineText">⚠️ Sin conexión: 0 ajustes pendientes</span><button class="sync-btn" onclick="sincronizarDatos()">Sincronizar</button></div>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn active">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <div class="form-section">
        <h3 style="margin-top:0; color:var(--primary);">1. Ajuste de Pesos y Empaque</h3>
        <div id="reader-container"><div id="reader"></div></div>
        <form id="ajusteForm">
            <input type="text" id="folioDisplay" placeholder="Escanea o escribe folio..." required>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>Nuevo P. Bruto</label><input type="number" id="nuevoPesoBruto" step="0.01" required></div>
                <div style="flex:1;"><label>Nuevo P. Neto</label><input type="text" id="nuevoPesoNeto" readonly style="background-color: #e9ecef; font-weight: bold; color: var(--success);" placeholder="Auto"></div>
            </div>

            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>Cant. Cajas</label><input type="number" id="cantidadCajas" min="1" required></div>
                <div style="flex:1;">
                    <label>Tipo Caja</label>
                    <select id="tipoCaja" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Morelia">Morelia</option>
                        <option value="Naylea">Naylea</option>
                        <option value="Limonera">Limonera</option>
                        <option value="Arpilla">Arpilla</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Tipo Tarima</label>
                    <select id="tipoTarima" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Tarima azul">Tarima azul</option>
                        <option value="Tarima 2da">Tarima 2da</option>
                    </select>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <h3 style="margin-top:0; color:var(--rack-green);">2. Nueva Ubicación</h3>
            <select id="cuartoFrio" required>
                <option value="" disabled selected>Selecciona Cuarto...</option>
                <option value="Cuarto 1">Cuarto 1 (Terminado) - 6 Carriles</option>
                <option value="Cuarto 2">Cuarto 2 (General) - 6 Carriles</option>
                <option value="Cuarto 3">Cuarto 3 (General) - 4 Carriles</option>
                <option value="Cuarto 4">Cuarto 4 (General) - 3 Carriles</option>
                <option value="Cuarto 5">Cuarto 5 (Tomatillo) - 4 Carriles</option>
            </select>
            <select id="espacioRack" required disabled>
                <option value="" disabled selected>Selecciona primero un cuarto...</option>
            </select>
            <input type="hidden" id="levelSelected"><input type="hidden" id="depthSelected">
            <button type="submit" id="saveBtn" class="submit-btn" disabled>Actualizar y Guardar en Rack</button>
        </form>
        <div id="status-area"></div>
    </div>

    <div class="rack-map-section">
        <h3 id="rackTitle" style="margin-top:0;">Mapa de Rack</h3>
        <table class="rack-table" id="rackTable">
            <thead><tr><th>Folio</th><th>Producto</th><th>Peso neto</th><th>Caja</th><th>Tarima</th></tr></thead>
            <tbody>
                <tr class="level-separator"><td colspan="5">Nivel 3 (Alto)</td></tr>
                <tr class="rack-row empty" data-level="3" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="3" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="level-separator"><td colspan="5">Nivel 2 (Medio)</td></tr>
                <tr class="rack-row empty" data-level="2" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="2" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="level-separator"><td colspan="5">Nivel 1 (Piso)</td></tr>
                <tr class="rack-row empty" data-level="1" data-depth="4"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="3"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="2"><td></td><td></td><td></td><td></td><td></td></tr><tr class="rack-row empty" data-level="1" data-depth="1"><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";
    let inventarioGlobal = []; let buzonsalida = JSON.parse(localStorage.getItem('wms_ajustes_offline')) || [];
    
    // CONFIGURACIÓN DINÁMICA DE CARRILES Y PESOS (TARA)
    const configCarriles = { "Cuarto 1": 6, "Cuarto 2": 6, "Cuarto 3": 4, "Cuarto 4": 3, "Cuarto 5": 4 };
    const pesosCajas = { "Morelia": 2.0, "Naylea": 0.850, "Limonera": 0.780, "Arpilla": 0 };
    const pesosTarimas = { "Tarima azul": 23.0, "Tarima 2da": 12.0 };

    window.addEventListener('load', () => { iniciarCamara(); cargarInventario(); actualizarInterfazOffline(); });

    function actualizarInterfazOffline() {
        const banner = document.getElementById('offlineBanner');
        if (buzonsalida.length > 0) { banner.style.display = 'flex'; document.getElementById('offlineText').innerText = `⚠️ Sin conexión: ${buzonsalida.length} ajustes pendientes`;
        } else { banner.style.display = 'none'; }
    }

    window.addEventListener('online', sincronizarDatos);
    async function sincronizarDatos() {
        if (buzonsalida.length === 0) return; if (!navigator.onLine) { alert("Aún no tienes conexión a internet estable."); return; }
        document.getElementById('offlineText').innerText = "🔄 Sincronizando datos...";
        let pendientes = [];
        for (let i = 0; i < buzonsalida.length; i++) {
            try { await fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buzonsalida[i]) });
            } catch (error) { pendientes.push(buzonsalida[i]); }
        }
        buzonsalida = pendientes; localStorage.setItem('wms_ajustes_offline', JSON.stringify(buzonsalida));
        actualizarInterfazOffline(); if (buzonsalida.length === 0) { cargarInventario(); }
    }

    function cargarInventario() { fetch(urlGoogleScript + "?t=" + new Date().getTime()).then(res => res.json()).then(data => { inventarioGlobal = data; }); }

    function calcularPesoNetoAutomático() {
        let pBruto = parseFloat(document.getElementById('nuevoPesoBruto').value) || 0;
        let cantCajas = parseInt(document.getElementById('cantidadCajas').value) || 0;
        let tCaja = document.getElementById('tipoCaja').value;
        let tTarima = document.getElementById('tipoTarima').value;

        if (pBruto > 0 && cantCajas > 0 && tCaja && tTarima) {
            let pesoPorCaja = pesosCajas[tCaja] || 0;
            let pesoPorTarima = pesosTarimas[tTarima] || 0;
            let taraTotal = (cantCajas * pesoPorCaja) + pesoPorTarima;
            let pNetoCalculado = pBruto - taraTotal;
            
            if(pNetoCalculado < 0) pNetoCalculado = 0; 
            document.getElementById('nuevoPesoNeto').value = pNetoCalculado.toFixed(2);
        } else {
            document.getElementById('nuevoPesoNeto').value = "";
        }
        checkForm();
    }

    // LÓGICA DE CARRILES DINÁMICOS
    document.getElementById('cuartoFrio').addEventListener('change', (e) => {
        const cuartoSeleccionado = e.target.value;
        const selectorCarril = document.getElementById('espacioRack');
        selectorCarril.innerHTML = '<option value="" disabled selected>Selecciona Carril...</option>';
        
        if(configCarriles[cuartoSeleccionado]) {
            selectorCarril.disabled = false;
            for(let i = 1; i <= configCarriles[cuartoSeleccionado]; i++) {
                selectorCarril.innerHTML += `<option value="Carril ${i}">Carril ${i}</option>`;
            }
        }
        actualizarTablaMapa(); 
        checkForm();
    });

    const html5QrCode = new Html5Qrcode("reader");
    function iniciarCamara() {
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) { html5QrCode.start({ facingMode: "environment" }, { fps: 30, qrbox: { width: 250, height: 100 } }, text => { document.getElementById('folioDisplay').value = text; document.getElementById('reader-container').style.display='none'; html5QrCode.stop(); buscarPesosAnteriores(); }); }
        });
    }

    function buscarPesosAnteriores() {
        const folio = document.getElementById('folioDisplay').value.trim().toUpperCase();
        const tarima = inventarioGlobal.find(i => String(i.folio).toUpperCase() === folio);
        if(tarima) { 
            // Cargar datos previos para no tener que escribirlos desde cero
            document.getElementById('nuevoPesoBruto').value = tarima.pesoBruto; 
            if(tarima.cantidadCajas) document.getElementById('cantidadCajas').value = tarima.cantidadCajas;
            if(tarima.tipoCaja) document.getElementById('tipoCaja').value = tarima.tipoCaja;
            if(tarima.tarima) document.getElementById('tipoTarima').value = tarima.tarima;
            
            calcularPesoNetoAutomático(); 
        }
        checkForm();
    }
    document.getElementById('folioDisplay').addEventListener('change', buscarPesosAnteriores);

    function actualizarTablaMapa() {
        const c = document.getElementById('cuartoFrio').value; const e = document.getElementById('espacioRack').value;
        const tituloRack = document.getElementById('rackTitle');
        if(e) tituloRack.innerText = "Mapa de Rack - " + e; else tituloRack.innerText = "Mapa de Rack";
        document.querySelectorAll('.rack-row').forEach(row => { row.className = 'rack-row empty'; const tds = row.querySelectorAll('td'); for(let i=0; i<5; i++) tds[i].innerText = ""; });
        if (!c || !e) return;
        inventarioGlobal.forEach(item => {
            if (item.estatus === "Almacenado" && item.cuarto === c && item.ubicacion && item.ubicacion.startsWith(e)) {
                const match = item.ubicacion.match(/Nivel (\d+), Pos (\d+)/);
                if(match) {
                    const row = document.querySelector(`.rack-row[data-level="${match[1]}"][data-depth="${match[2]}"]`);
                    if(row) { row.className = 'rack-row filled'; const tds = row.querySelectorAll('td'); tds[0].innerText = item.folio; tds[1].innerText = item.producto; tds[2].innerText = item.pesoNeto; tds[3].innerText = item.tipoCaja; tds[4].innerText = item.tarima; }
                }
            }
        });
    }

    document.getElementById('espacioRack').addEventListener('change', () => { actualizarTablaMapa(); checkForm(); });
    
    document.getElementById('rackTable').addEventListener('click', function(e) {
        const row = e.target.closest('.rack-row'); if (!row || row.classList.contains('filled')) return;
        document.querySelectorAll('.rack-row').forEach(r => r.classList.remove('selected')); row.classList.add('selected');
        document.getElementById('levelSelected').value = row.getAttribute('data-level'); document.getElementById('depthSelected').value = row.getAttribute('data-depth'); checkForm();
    });

    function checkForm() {
        let pBruto = parseFloat(document.getElementById('nuevoPesoBruto').value); 
        let pNeto = parseFloat(document.getElementById('nuevoPesoNeto').value);
        let cCajas = parseInt(document.getElementById('cantidadCajas').value);
        let tCaja = document.getElementById('tipoCaja').value;
        let tTarima = document.getElementById('tipoTarima').value;

        // Ahora evaluamos que estén llenos todos los campos del empaque también
        let datosCompletos = (pBruto > 0 && !isNaN(pNeto) && cCajas > 0 && tCaja !== "" && tTarima !== "");
        
        if(document.getElementById('folioDisplay').value && datosCompletos && document.getElementById('levelSelected').value && document.getElementById('espacioRack').value) { 
            document.getElementById('saveBtn').disabled = false; 
        } else { 
            document.getElementById('saveBtn').disabled = true; 
        }
    }
    
    // Activar cálculos dinámicos al teclear
    document.querySelectorAll('input, select').forEach(i => i.addEventListener('input', calcularPesoNetoAutomático));

    document.getElementById('ajusteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const datos = {
            action: 'ajuste_reubicacion', 
            folio: document.getElementById('folioDisplay').value, 
            pesoBruto: document.getElementById('nuevoPesoBruto').value, 
            pesoNeto: document.getElementById('nuevoPesoNeto').value,
            cantidadCajas: parseInt(document.getElementById('cantidadCajas').value),
            tipoCaja: document.getElementById('tipoCaja').value,
            tarima: document.getElementById('tipoTarima').value,
            cuarto: document.getElementById('cuartoFrio').value, 
            espacio: document.getElementById('espacioRack').value, 
            level: document.getElementById('levelSelected').value, 
            depth: document.getElementById('depthSelected').value,
            operador: sesion.nombre 
        };

        document.getElementById('status-area').innerHTML = "<span style='color:green'>¡Ajuste procesado localmente!</span>";
        document.getElementById('ajusteForm').reset(); 
        document.getElementById('espacioRack').innerHTML = '<option value="" disabled selected>Selecciona primero un cuarto...</option>';
        document.getElementById('espacioRack').disabled = true;
        document.getElementById('saveBtn').disabled = true;

        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos)})
        .then(() => { document.getElementById('status-area').innerHTML = "<span style='color:green'>¡Datos y Ubicación Actualizados en Servidor!</span>"; cargarInventario();
        }).catch(() => { buzonsalida.push(datos); localStorage.setItem('wms_ajustes_offline', JSON.stringify(buzonsalida)); actualizarInterfazOffline(); document.getElementById('status-area').innerHTML = "<span style='color:#ffc107'>Ajuste guardado localmente.</span>"; });
    });
</script>
</body>
</html>
