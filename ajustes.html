<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Ajustes</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --warning: #ffc107; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .nav-header { width: 100%; max-width: 500px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block;}
        .submit-btn { background-color: var(--warning); color: #333; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #reader-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; } #reader { width: 100%; }
        #status-area { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>
<div class="container">
    <h2 style="text-align:center; color:var(--primary);">Ajuste de Sobrantes</h2>
    <div id="reader-container"><div id="reader"></div></div>
    <form id="ajusteForm">
        <label>Folio de la Tarima</label><input type="text" id="folioDisplay" required>
        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>Nuevo P. Bruto</label><input type="number" id="nuevoPesoBruto" step="0.01" required></div>
            <div style="flex:1;"><label>Nuevo P. Neto</label><input type="number" id="nuevoPesoNeto" step="0.01" required></div>
        </div>
        <button type="submit" id="saveBtn" class="submit-btn" disabled>Actualizar Pesos</button>
    </form>
    <div id="status-area"></div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbwfj9TXJqRFq2qhJmJypKTIa_p44DD5USRckmc1HaEcgLHoCfP9U1WDtLpKSL4Z3dkSDQ/exec";
    
    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) { html5QrCode.start({ facingMode: "environment" }, { fps: 30, qrbox: { width: 250, height: 100 } }, text => {
            document.getElementById('folioDisplay').value = text; document.getElementById('reader-container').style.display='none'; html5QrCode.stop(); checkForm();
        }); }
    });

    function checkForm() {
        document.getElementById('saveBtn').disabled = !(document.getElementById('folioDisplay').value && document.getElementById('nuevoPesoBruto').value && document.getElementById('nuevoPesoNeto').value);
    }
    document.querySelectorAll('input').forEach(i => i.addEventListener('input', checkForm));

    document.getElementById('ajusteForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.innerText = "Actualizando...";
        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
            action: 'update_weight', folio: document.getElementById('folioDisplay').value, pesoBruto: document.getElementById('nuevoPesoBruto').value, pesoNeto: document.getElementById('nuevoPesoNeto').value
        })}).then(() => {
            document.getElementById('status-area').innerHTML = "<span style='color:green'>¡Pesos actualizados!</span>";
            document.getElementById('ajusteForm').reset(); btn.innerText = "Actualizar Pesos";
        });
    });
</script>
</body>
</html>
