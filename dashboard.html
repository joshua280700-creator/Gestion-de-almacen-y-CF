<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Dashboard</title>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --info: #17a2b8; --success: #28a745; --danger: #dc3545;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; max-width: 900px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px;}
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;}
        .metric-card { background: white; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-bottom: 5px solid #ccc;}
        .metric-card.m-recibido { border-color: var(--info); }
        .metric-card.m-almacenado { border-color: var(--success); }
        .metric-card.m-pt { border-color: var(--danger); }
        .metric-card h3 { margin: 0; color: #666; font-size: 16px; text-transform: uppercase;}
        .metric-card .number { font-size: 40px; font-weight: bold; color: var(--primary); margin: 10px 0;}
        .metric-card p { margin: 0; color: #888; font-size: 13px; font-weight: bold;}

        /* ESTILO DEL BOTÓN DE CERRAR SESIÓN FLOTANTE */
        .logout-btn {
            position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000;
        }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<!-- CANDADO DE SEGURIDAD DIRECTIVOS/ADMIN -->
<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    
    // Solo Admin y Directivos pueden entrar aquí
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== "Directivos")) { 
        window.location.href = "login.html"; 
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol === "Directivos") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                // Ocultar todo lo que NO sea Dashboard o Rastreador
                if(txt !== "Dashboard" && txt !== "Rastreador") {
                    btn.style.display = 'none';
                }
            });
        }
        
        // Botón flotante
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn active">Dashboard</a>
</div>

<div class="container">
    <h2>📊 Resumen de Operación (Vegxspress)</h2>
    <div style="text-align:center; color:#666; font-size:13px; margin-top:-10px; margin-bottom:20px;">Actualizado en tiempo real</div>
    
    <div id="loadingBox" style="text-align:center; padding: 40px; font-weight:bold; color:var(--primary);">Calculando métricas...</div>

    <div class="metrics-grid" id="metricsGrid" style="display:none;">
        <div class="metric-card m-recibido">
            <h3>En Andén (Pendiente)</h3>
            <div class="number" id="kpiRecibidos">0</div>
            <p>Tarimas por reubicar</p>
        </div>
        
        <div class="metric-card m-almacenado">
            <h3>En Cuartos Fríos</h3>
            <div class="number" id="kpiAlmacenados">0</div>
            <p>Tarimas en Rack</p>
        </div>

        <div class="metric-card m-pt">
            <h3>Salidas a Producción</h3>
            <div class="number" id="kpiPT">0</div>
            <p>Tarimas despachadas</p>
        </div>
    </div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";

    window.onload = function() {
        fetch(urlGoogleScript + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                let countRecibido = 0;
                let countAlmacenado = 0;
                let countPT = 0;

                data.forEach(item => {
                    if(item.estatus === "Recibido") countRecibido++;
                    if(item.estatus === "Almacenado") countAlmacenado++;
                    if(item.estatus === "PT") countPT++;
                });

                document.getElementById('kpiRecibidos').innerText = countRecibido;
                document.getElementById('kpiAlmacenados').innerText = countAlmacenado;
                document.getElementById('kpiPT').innerText = countPT;

                document.getElementById('loadingBox').style.display = 'none';
                document.getElementById('metricsGrid').style.display = 'grid';
            })
            .catch(err => {
                document.getElementById('loadingBox').innerText = "Error al cargar la información. Revisa tu conexión.";
                document.getElementById('loadingBox').style.color = "red";
            });
    };
</script>
</body>
</html>
