<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario IND - Vegxpress</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary: #1F4E78;
            --success: #28a745;
            --danger: #dc3545;
            --border: #dee2e6;
            
            /* Colores de las Áreas (Más suaves para no saturar) */
            --c-alm: #2E7D32; 
            --c-prod: #F9A825; 
            --c-cf1: #1565C0; 
            --c-cf24: #616161; 
            --c-cf5: #5D4037; 
            --c-desc: #0277BD; 
            --c-huerto: #C62828; 
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: var(--bg-color); color: #333;}
        
        .header { background-color: var(--primary); color: white; padding: 12px 20px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px;}
        .header .logo { font-style: italic; font-weight: 900; letter-spacing: 1px; color: #a4d233; }

        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; background: white; padding: 12px 20px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); align-items: center; justify-content: space-between;}
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-weight: 600; font-size: 13px; color: #555; }
        select, input[type="date"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none;}
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; }
        .file-upload-btn { background-color: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        .file-upload-btn:hover { background-color: #5a6268; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;}
        .status-badge { background-color: #ffc107; color: #000; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 10px; display: none;}
        .status-badge.loaded { background-color: var(--success); color: white;}

        /* Contenedor optimizado */
        .table-container { background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: auto; max-height: 75vh; position: relative;}
        
        table { width: 100%; border-collapse: collapse; min-width: 1500px; font-size: 12px;}
        
        thead { position: sticky; top: 0; z-index: 10; }
        th { padding: 8px 4px; text-align: center; border: 1px solid var(--border); font-weight: 700; text-transform: uppercase; font-size: 11px;}
        td { padding: 4px; border: 1px solid var(--border); text-align: center; background-color: #fff;}
        
        th.sticky-col, td.sticky-col { position: sticky; z-index: 5; background-color: #f8f9fa;}
        th.col-codigo, td.col-codigo { left: 0; min-width: 45px; font-weight: bold; color: #555;}
        
        th.col-producto, td.col-producto { left: 55px; min-width: 200px; max-width: 250px; text-align: left !important; box-shadow: 2px 0 5px rgba(0,0,0,0.05); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        thead th.sticky-col { z-index: 11; background-color: #e9ecef; }

        .h-alm { background-color: var(--c-alm); color: white; }
        .h-prod { background-color: var(--c-prod); color: black; }
        .h-cf1 { background-color: var(--c-cf1); color: white; }
        .h-cf24 { background-color: var(--c-cf24); color: white; }
        .h-cf5 { background-color: var(--c-cf5); color: white; }
        .h-desc { background-color: var(--c-desc); color: white; }
        .h-huerto { background-color: var(--c-huerto); color: white; }
        .h-total { background-color: #333; color: white; }

        .sub-header th { background-color: #f1f3f5; color: #555; font-size: 10px; }

        input[type="number"] { width: 50px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 3px; font-weight: bold; background-color: #fff;}
        input[type="number"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 3px rgba(31, 78, 120, 0.3);}
        
        input[readonly] { background-color: transparent; border: none; font-weight: normal; color: #777; width: 45px; text-align: center;}
        input[readonly].updated { color: #333; font-weight: 600; }

        .dif-result { font-weight: bold; font-size: 14px; padding: 2px 4px; border-radius: 3px; display: inline-block; min-width: 25px;}
        .dif-ok { color: var(--success); } /* Regresamos la palomita verde */
        .dif-alert { color: white; background-color: var(--danger); font-size: 12px;} 
        
        .total-cell { font-weight: bold; font-size: 13px; background-color: #f8f9fa !important; color: #333;}

        .hidden-area { display: none !important; }
        .compact-view table { min-width: auto; width: 100%; }

        .btn-guardar { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; float: right; margin-top: 15px; transition: 0.2s;}
        .btn-guardar:hover { background-color: #153a5c; }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="logo">Vegxpress</span> | INVENTARIO IND</h1>
        <div style="text-align: right; font-size: 12px;">
            <div>Depto: <strong>Capturista de Producción</strong></div>
        </div>
    </div>

    <div class="controls">
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="control-group">
                <label>Fecha:</label>
                <input type="date" id="fecha-inventario">
            </div>
            <div class="control-group">
                <label>Filtro:</label>
                <select id="area-selector" onchange="filtrarArea()">
                    <option value="todas">Ver Todas las Áreas</option>
                    <option value="alm">Almacén IND</option>
                    <option value="prod">Producción</option>
                    <option value="cf1">Cuarto Frío 1</option>
                    <option value="cf24">Cuartos Fríos 2-4</option>
                    <option value="cf5">Cuarto Frío 5</option>
                    <option value="desc">Descarga</option>
                    <option value="huerto">Huerto Basal</option>
                </select>
            </div>
        </div>
        
        <div class="control-group">
            <div class="file-upload-wrapper">
                <button class="file-upload-btn">📥 Cargar Excel</button>
                <input type="file" id="fileOracle" accept=".xlsx, .xls" onchange="procesarExcelOracle(event)">
            </div>
            <span id="oracle-status" class="status-badge">Esperando...</span>
        </div>
    </div>

    <div class="table-container" id="main-container">
        <table id="tabla-inventario">
            <thead>
                <tr>
                    <th rowspan="2" class="sticky-col col-codigo">CÓD.</th>
                    <th rowspan="2" class="sticky-col col-producto">PRODUCTO</th>
                    <th colspan="3" class="area-group area-alm h-alm">ALMACÉN IND</th>
                    <th colspan="3" class="area-group area-prod h-prod">PRODUCCIÓN</th>
                    <th colspan="3" class="area-group area-cf1 h-cf1">CF 1</th>
                    <th colspan="3" class="area-group area-cf24 h-cf24">CF 2-4</th>
                    <th colspan="3" class="area-group area-cf5 h-cf5">CF 5</th>
                    <th colspan="3" class="area-group area-desc h-desc">DESCARGA</th>
                    <th colspan="3" class="area-group area-huerto h-huerto">HUERTO BASAL</th>
                    <th rowspan="2" class="h-total">TOTAL<br>FÍSICO</th>
                </tr>
                <tr class="sub-header">
                    <!-- ALMACEN -->
                    <th class="area-group area-alm">FÍS</th><th class="area-group area-alm">ORC</th><th class="area-group area-alm">DIF</th>
                    <!-- PRODUCCION -->
                    <th class="area-group area-prod">FÍS</th><th class="area-group area-prod">ORC</th><th class="area-group area-prod">DIF</th>
                    <!-- CF 1 -->
                    <th class="area-group area-cf1">FÍS</th><th class="area-group area-cf1">ORC</th><th class="area-group area-cf1">DIF</th>
                    <!-- CF 2-4 -->
                    <th class="area-group area-cf24">FÍS</th><th class="area-group area-cf24">ORC</th><th class="area-group area-cf24">DIF</th>
                    <!-- CF 5 -->
                    <th class="area-group area-cf5">FÍS</th><th class="area-group area-cf5">ORC</th><th class="area-group area-cf5">DIF</th>
                    <!-- DESCARGA -->
                    <th class="area-group area-desc">FÍS</th><th class="area-group area-desc">ORC</th><th class="area-group area-desc">DIF</th>
                    <!-- HUERTO BASAL -->
                    <th class="area-group area-huerto">FÍS</th><th class="area-group area-huerto">ORC</th><th class="area-group area-huerto">DIF</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <!-- Javascript inyecta las filas -->
            </tbody>
        </table>
    </div>

    <button class="btn-guardar" onclick="guardarInventario()">💾 Guardar Inventario Físico</button>

<script>
    // URL DE TU NUEVO APPS SCRIPT
    const urlInventarios = "https://script.google.com/macros/s/AKfycbzX4Gjxx87ocYFgkMWsf4rlvX0SnaNjRG_iSyCACwJO8bMcWuV0gii50H-OpbIWJrr0FA/exec";

    const productos = [
        { cod: "A101", desc: "CAJA PASTICA NAYLEA" },
        { cod: "A202", desc: "CAJA IFCO 6413" },
        { cod: "A203", desc: "CAJA IFCO 6423" },
        { cod: "A301", desc: "CAJA CARTON GENERICA 40 LBS" },
        { cod: "A303", desc: "CAJA CARTON 1/2 BUSHEL" },
        { cod: "A304", desc: "CAJA CARTON 1/4 BUSHEL" },
        { cod: "A401", desc: "ESQUINEROS DE CARTON CAL 1.20" },
        { cod: "A402", desc: "ESQUINEROS DE CARTON CAL 1.70" },
        { cod: "A403", desc: "LAMINA DE CARTON KRAFT (P/TARIMA)" },
        { cod: "A905", desc: "TARIMA NACIONAL DE BARROTE RECICLADA" },
        { cod: "A502", desc: "TARIMA EXPORTACION DE CUBO PRIMERA C/SELLO" },
        { cod: "A505", desc: "TARIMA CUBO RECICLADA" },
        { cod: "A701", desc: "RAFIA BLANCA BOBINA GDE. (4KG)" },
        { cod: "A702", desc: "FLEJE PLASTICO VERDE LISO" },
        { cod: "A704", desc: "PELICULA PLASTICA STRETCH /EMPLAYE" },
        { cod: "A705", desc: "FLEJE PLASTICO 1/2 NEGRO" },
        { cod: "A801", desc: "RIBBON DE TINTA GRANDE ZEBRA (110MM X 300M)" },
        { cod: "A802", desc: "RIBBON DE TINTA CHICO ZEBRA (110MM X 74M)" },
        { cod: "A803", desc: "ETIQUETAS COLORES 8x4 (375 ETQ X ROLLO)" },
        { cod: "A804", desc: "ETIQUETAS BLANCAS 4x2 (3000 ETQ X ROLLO)" },
        { cod: "A805", desc: "ETIQUETAS BLANCAS 4x2 (1500 ETQ X ROLLO)" },
        { cod: "A103", desc: "CAJA PLASTICA MORELIA" },
        { cod: "A503", desc: "TARIMA SEGUNDA" },
        { cod: "A601", desc: "TARIMA REFORZADA AZUL" },
        { cod: "A904", desc: "CAJA LIMONERA" }
    ];

    const areasKeys = ['alm', 'prod', 'cf1', 'cf24', 'cf5', 'desc', 'huerto'];

    const oracleMap = {
        'alm': 'Monterrey : Mty - Almacen Indirectos',
        'prod': 'Monterrey : Mty - Producción',
        'cf1': 'Monterrey : Mty - Cuarto Frio 1 PT',
        'cf24': 'Monterrey : Mty - Almacén General MP CF2 a CF4',
        'cf5': 'Monterrey : Mty - Cuarto Frio 5 Tomatillo',
        'desc': 'Monterrey : Mty - Descargas',
        'huerto': 'Santa Catarina : SC - Almacen Indirectos'
    };

    window.onload = function() {
        document.getElementById('fecha-inventario').valueAsDate = new Date();
        renderizarTabla();
    };

    function renderizarTabla() {
        const tbody = document.getElementById('tabla-body');
        let html = '';

        productos.forEach((prod, index) => {
            html += `<tr data-index="${index}" id="row-${prod.cod}">
                        <td class="sticky-col col-codigo" title="${prod.cod}">${prod.cod}</td>
                        <td class="sticky-col col-producto" title="${prod.desc}">${prod.desc}</td>`;
            
            areasKeys.forEach(area => {
                html += `
                    <td class="area-group area-${area}">
                        <input type="number" class="in-fisico" data-area="${area}" oninput="calcularFila('${prod.cod}', '${area}')">
                    </td>
                    <td class="area-group area-${area}">
                        <input type="text" class="in-oracle" data-area="${area}" value="-" readonly tabindex="-1">
                    </td>
                    <td class="area-group area-${area}">
                        <span class="dif-result dif-ok" data-area="${area}">-</span>
                    </td>
                `;
            });

            html += `<td class="total-cell" id="total-${prod.cod}">0</td>
                     </tr>`;
        });

        tbody.innerHTML = html;
    }

    function calcularFila(codigo, area) {
        const tr = document.getElementById(`row-${codigo}`);
        
        const fisicoInput = tr.querySelector(`.in-fisico[data-area="${area}"]`);
        const oracleInput = tr.querySelector(`.in-oracle[data-area="${area}"]`);
        const resultSpan = tr.querySelector(`.dif-result[data-area="${area}"]`);

        let fisicoVal = fisicoInput.value.trim() === "" ? null : parseFloat(fisicoInput.value);
        let oracleVal = oracleInput.value === "-" ? 0 : parseFloat(oracleInput.value);
        
        if (fisicoVal === null) {
            resultSpan.textContent = "-";
            resultSpan.className = "dif-result dif-ok";
        } else {
            let diferencia = fisicoVal - oracleVal;
            
            if (diferencia === 0) {
                // REGRESAMOS LA PALOMITA VERDE AQUÍ
                resultSpan.textContent = "✔";
                resultSpan.className = "dif-result dif-ok";
            } else {
                let dispDif = diferencia % 1 !== 0 ? diferencia.toFixed(1) : diferencia;
                resultSpan.textContent = diferencia > 0 ? `+${dispDif}` : dispDif;
                resultSpan.className = "dif-result dif-alert";
            }
        }

        let sumaTotal = 0;
        const todosLosFisicos = tr.querySelectorAll('.in-fisico');
        todosLosFisicos.forEach(inp => {
            if(inp.value.trim() !== "") {
                sumaTotal += parseFloat(inp.value);
            }
        });
        document.getElementById(`total-${codigo}`).textContent = sumaTotal === 0 ? "0" : sumaTotal;
    }

    function filtrarArea() {
        const seleccion = document.getElementById('area-selector').value;
        const container = document.getElementById('main-container');
        const todasLasAreasDOM = document.querySelectorAll('.area-group');
        
        todasLasAreasDOM.forEach(el => el.classList.remove('hidden-area'));

        if (seleccion !== 'todas') {
            container.classList.add('compact-view');
            todasLasAreasDOM.forEach(el => {
                if (!el.classList.contains(`area-${seleccion}`)) {
                    el.classList.add('hidden-area');
                }
            });
        } else {
            container.classList.remove('compact-view');
        }
    }

    function procesarExcelOracle(event) {
        const file = event.target.files[0];
        if (!file) return;

        const badge = document.getElementById('oracle-status');
        badge.style.display = 'inline-block';
        badge.textContent = "Procesando...";
        badge.className = "status-badge";

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const jsonOracle = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
            
            const headersAreas = jsonOracle[6];
            const headersTipos = jsonOracle[7];
            
            let colIndexes = {};
            areasKeys.forEach(areaKey => {
                const oracleName = oracleMap[areaKey];
                const areaColIndex = headersAreas.findIndex(h => typeof h === 'string' && h.includes(oracleName));
                
                if(areaColIndex !== -1) {
                    for(let i = areaColIndex; i < areaColIndex + 10; i++) {
                        if(headersTipos[i] === "Físico") {
                            colIndexes[areaKey] = i;
                            break;
                        }
                    }
                }
            });

            let actualizados = 0;
            for(let row = 8; row < jsonOracle.length; row++) {
                const rowData = jsonOracle[row];
                const articuloCod = String(rowData[0]).trim(); 

                if(articuloCod && articuloCod !== "") {
                    const tr = document.getElementById(`row-${articuloCod}`);
                    if(tr) {
                        areasKeys.forEach(areaKey => {
                            if(colIndexes[areaKey] !== undefined) {
                                let valorOracle = parseFloat(rowData[colIndexes[areaKey]]) || 0;
                                const inOracle = tr.querySelector(`.in-oracle[data-area="${areaKey}"]`);
                                
                                let displayVal = valorOracle % 1 !== 0 ? valorOracle.toFixed(1) : valorOracle;
                                inOracle.value = displayVal;
                                inOracle.classList.add('updated'); 
                                
                                calcularFila(articuloCod, areaKey);
                            }
                        });
                        actualizados++;
                    }
                }
            }

            badge.textContent = `¡Cargado!`;
            badge.className = "status-badge loaded";
        };
        
        reader.readAsArrayBuffer(file);
    }

    function guardarInventario() {
        const btn = document.querySelector('.btn-guardar');
        btn.disabled = true;
        btn.innerText = "⏳ Guardando...";

        const fechaInv = document.getElementById('fecha-inventario').value;
        if (!fechaInv) {
            alert("Por favor selecciona la fecha del inventario.");
            btn.disabled = false;
            btn.innerText = "💾 Guardar Inventario Físico";
            return;
        }

        let registrosGuardar = [];

        productos.forEach(prod => {
            const tr = document.getElementById(`row-${prod.cod}`);
            
            areasKeys.forEach(area => {
                const fisicoInput = tr.querySelector(`.in-fisico[data-area="${area}"]`);
                const oracleInput = tr.querySelector(`.in-oracle[data-area="${area}"]`);
                
                let fisicoVal = fisicoInput.value.trim();
                
                // Si el usuario capturó algo (incluso un 0 cuenta como captura), lo guardamos
                if (fisicoVal !== "") {
                    let oracleVal = oracleInput.value === "-" ? 0 : parseFloat(oracleInput.value);
                    let fisicoNum = parseFloat(fisicoVal);
                    let diferencia = fisicoNum - oracleVal;
                    
                    let nombreArea = oracleMap[area] || area;

                    registrosGuardar.push({
                        fecha: fechaInv,
                        area: nombreArea,
                        codigo: prod.cod,
                        producto: prod.desc,
                        fisico: fisicoNum,
                        oracle: oracleVal,
                        diferencia: diferencia
                    });
                }
            });
        });

        if (registrosGuardar.length === 0) {
            alert("No has capturado ningún valor físico para guardar.");
            btn.disabled = false;
            btn.innerText = "💾 Guardar Inventario Físico";
            return;
        }

        const payload = {
            action: "guardar_inventario_ind",
            registros: registrosGuardar
        };

        fetch(urlInventarios, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert(`¡Éxito! Se guardaron ${registrosGuardar.length} registros en la base de datos.`);
            btn.innerText = "✅ Guardado";
            setTimeout(() => { window.location.reload(); }, 2000);
        })
        .catch(err => {
            alert("Hubo un error de conexión.");
            btn.disabled = false;
            btn.innerText = "💾 Guardar Inventario Físico";
        });
    }
</script>
</body>
</html>
