<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario IND - Vegxpress</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary: #1F4E78;
            --success: #28a745;
            --danger: #dc3545;
            --border: #dee2e6;
            
            --c-alm: #2E7D32; 
            --c-prod: #F9A825; 
            --c-cf1: #1565C0; 
            --c-cf24: #616161; 
            --c-cf5: #5D4037; 
            --c-desc: #0277BD; 
            --c-huerto: #C62828; 
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: #333;}
        
        .navbar { background-color: #112a42; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0;}
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: white; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-size: 14px; font-weight: bold;}
        .nav-links a:hover, .nav-links a.active { background-color: var(--primary); }
        .btn-logout { background-color: var(--danger); color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;}

        .main-content { padding: 15px; }

        .header { background-color: var(--primary); color: white; padding: 12px 20px; border-radius: 0 0 6px 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px;}
        .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
        .header .logo { font-style: italic; font-weight: 900; letter-spacing: 1px; color: #a4d233; }
        .header-info { text-align: right; font-size: 12px; }

        /* NUEVO: BARRA DE ESTADO DE CONEXIÓN */
        .status-bar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3);}
        .dot { height: 10px; width: 10px; background-color: #28a745; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px #28a745;}
        .dot.offline { background-color: #dc3545; box-shadow: 0 0 5px #dc3545;}
        .dot.syncing { background-color: #ffc107; box-shadow: 0 0 5px #ffc107; animation: blink 1s infinite;}
        @keyframes blink { 50% { opacity: 0.4; } }

        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; background: white; padding: 12px 20px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); align-items: center; justify-content: space-between;}
        .control-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;}
        label { font-weight: 600; font-size: 13px; color: #555; }
        select, input[type="date"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box; max-width: 100%;}
        
        .btn-buscar { background-color: #17a2b8; color: white; border: none; padding: 7px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; box-sizing: border-box;}
        .btn-buscar:hover { background-color: #138496; }

        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; box-sizing: border-box;}
        .file-upload-btn { background-color: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; box-sizing: border-box;}
        .file-upload-btn:hover { background-color: #5a6268; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;}
        
        .status-badge { background-color: #ffc107; color: #000; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 10px; display: none;}
        .status-badge.loaded { background-color: var(--success); color: white;}

        .table-container { background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: auto; max-height: 70vh; position: relative;}
        table { width: 100%; border-collapse: collapse; min-width: 1550px; font-size: 12px;}
        
        thead { position: sticky; top: 0; z-index: 10; }
        th { padding: 8px 4px; text-align: center; border: 1px solid var(--border); font-weight: 700; text-transform: uppercase; font-size: 11px;}
        td { padding: 4px; border: 1px solid var(--border); text-align: center; background-color: #fff;}
        
        th.sticky-col, td.sticky-col { position: sticky; z-index: 5; background-color: #f8f9fa;}
        th.col-codigo, td.col-codigo { left: 0; min-width: 45px; font-weight: bold; color: #555;}
        th.col-producto, td.col-producto { left: 55px; min-width: 200px; max-width: 250px; text-align: left !important; box-shadow: 2px 0 5px rgba(0,0,0,0.05); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        thead th.sticky-col { z-index: 11; background-color: #e9ecef; }

        .h-alm { background-color: var(--c-alm); color: white; }
        .h-prod { background-color: var(--c-prod); color: black; }
        .h-cf1 { background-color: var(--c-cf1); color: white; }
        .h-cf24 { background-color: var(--c-cf24); color: white; }
        .h-cf5 { background-color: var(--c-cf5); color: white; }
        .h-desc { background-color: var(--c-desc); color: white; }
        .h-huerto { background-color: var(--c-huerto); color: white; }
        .h-total { background-color: #333; color: white; }

        .sub-header th { background-color: #f1f3f5; color: #555; font-size: 10px; }

        input[type="number"] { width: 50px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 3px; font-weight: bold; background-color: #fff; box-sizing: border-box;}
        input[type="number"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 3px rgba(31, 78, 120, 0.3);}
        
        input[readonly] { background-color: transparent; border: none; font-weight: normal; color: #777; width: 45px; text-align: center;}
        input[readonly].updated { color: #333; font-weight: 600; }

        .dif-result { font-weight: bold; font-size: 14px; padding: 2px 4px; border-radius: 3px; display: inline-block; min-width: 25px;}
        .dif-ok { color: var(--success); } 
        .dif-alert { color: white; background-color: var(--danger); font-size: 12px;} 
        
        .total-cell { font-weight: bold; font-size: 13px; background-color: #f8f9fa !important; color: #333;}
        .status-cell { font-size: 16px; min-width: 40px; background-color: #f8f9fa !important;} /* Nueva columna */

        .hidden-area { display: none !important; }
        .compact-view table { min-width: auto; width: 100%; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 15px;}
            .header-info { text-align: left; width: 100%; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; margin-top: 5px;}
            
            .controls { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px;}
            .controls > div { width: 100%; justify-content: space-between; }
            .control-group { width: 100%; display: grid; grid-template-columns: 1fr; gap: 10px; }
            .control-group.doble { grid-template-columns: 1fr 1fr; align-items: end;}
            
            select, input[type="date"], .btn-buscar, .file-upload-wrapper, .file-upload-btn { width: 100%; margin: 0;}
            
            th.col-producto, td.col-producto { 
                min-width: 120px; 
                max-width: 140px; 
                white-space: normal;
                font-size: 10px; 
                line-height: 1.2;
            }
            input[type="number"] { width: 45px; }
            input[readonly] { width: 35px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div style="font-weight: 900; font-style: italic; color: #a4d233; font-size: 18px;">Vegxpress WMS</div>
        <div class="nav-links">
            <a href="recepcion.html">Dashboard</a>
            <a href="inventario_ind.html" class="active">Inv. IND</a>
            <a href="alerta_stock.html">Alertas Stock</a>
        </div>
        <button class="btn-logout">Cerrar Sesión</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1><span class="logo">Vegxpress</span> | INVENTARIO IND</h1>
            <div class="status-bar">
                <span class="dot" id="led-conexion"></span>
                <span id="texto-conexion">En línea</span>
            </div>
            <div class="header-info">
                <div>Depto: <strong>Capturista de Producción</strong></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group doble">
                <div>
                    <label>Fecha:</label>
                    <input type="date" id="fecha-inventario" onchange="cargarMemoriaLocal()">
                </div>
                <div>
                    <button type="button" class="btn-buscar" onclick="buscarPorFecha()">🔍 Cargar Guardado</button>
                </div>
            </div>
            
            <!-- CONTENEDOR DE FILTROS -->
            <div style="display: flex; gap: 15px; flex-grow: 1; flex-wrap: wrap;">
                <div class="control-group" style="flex-grow: 1; min-width: 150px;">
                    <label>Área:</label>
                    <select id="area-selector" onchange="filtrarArea()">
                        <option value="todas">Ver Todas las Áreas</option>
                        <option value="alm">Almacén IND</option>
                        <option value="prod">Producción</option>
                        <option value="cf1">Cuarto Frío 1</option>
                        <option value="cf24">Cuartos Fríos 2-4</option>
                        <option value="cf5">Cuarto Frío 5</option>
                        <option value="desc">Descarga</option>
                        <option value="huerto">Huerto Basal</option>
                    </select>
                </div>
                
                <div class="control-group" style="flex-grow: 1; min-width: 200px;">
                    <label>Insumo:</label>
                    <select id="insumo-selector" onchange="filtrarProducto()">
                        <option value="todos">Ver Todos los Insumos</option>
                        <!-- Se llena con JS -->
                    </select>
                </div>
            </div>
            
            <div class="control-group doble" style="grid-template-columns: 2fr 1fr; align-items: center;">
                <div class="file-upload-wrapper">
                    <button class="file-upload-btn">📥 Cargar Excel Oracle</button>
                    <input type="file" id="fileOracle" accept=".xlsx, .xls" onchange="procesarExcelOracle(event)">
                </div>
                <span id="oracle-status" class="status-badge" style="width:100%; text-align:center;">Esperando...</span>
            </div>
        </div>

        <div class="table-container" id="main-container">
            <table id="tabla-inventario">
                <thead>
                    <tr>
                        <th rowspan="2" class="sticky-col col-codigo">CÓD.</th>
                        <th rowspan="2" class="sticky-col col-producto">PRODUCTO</th>
                        <th colspan="3" class="area-group area-alm h-alm">ALMACÉN IND</th>
                        <th colspan="3" class="area-group area-prod h-prod">PRODUCCIÓN</th>
                        <th colspan="3" class="area-group area-cf1 h-cf1">CF 1</th>
                        <th colspan="3" class="area-group area-cf24 h-cf24">CF 2-4</th>
                        <th colspan="3" class="area-group area-cf5 h-cf5">CF 5</th>
                        <th colspan="3" class="area-group area-desc h-desc">DESCARGA</th>
                        <th colspan="3" class="area-group area-huerto h-huerto">HUERTO BASAL</th>
                        <th rowspan="2" class="h-total">TOTAL<br>FÍSICO</th>
                        <th rowspan="2" class="h-total">ESTADO</th> <!-- NUEVO -->
                    </tr>
                    <tr class="sub-header">
                        <th class="area-group area-alm">FÍS</th><th class="area-group area-alm">ORC</th><th class="area-group area-alm">DIF</th>
                        <th class="area-group area-prod">FÍS</th><th class="area-group area-prod">ORC</th><th class="area-group area-prod">DIF</th>
                        <th class="area-group area-cf1">FÍS</th><th class="area-group area-cf1">ORC</th><th class="area-group area-cf1">DIF</th>
                        <th class="area-group area-cf24">FÍS</th><th class="area-group area-cf24">ORC</th><th class="area-group area-cf24">DIF</th>
                        <th class="area-group area-cf5">FÍS</th><th class="area-group area-cf5">ORC</th><th class="area-group area-cf5">DIF</th>
                        <th class="area-group area-desc">FÍS</th><th class="area-group area-desc">ORC</th><th class="area-group area-desc">DIF</th>
                        <th class="area-group area-huerto">FÍS</th><th class="area-group area-huerto">ORC</th><th class="area-group area-huerto">DIF</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                </tbody>
            </table>
        </div>
        
        <!-- EL BOTÓN GUARDAR FUE ELIMINADO PARA EL AUTO-GUARDADO -->

    </div>

<script>
    // === PROTECCIÓN DE SESIÓN ===
    window.addEventListener('DOMContentLoaded', (event) => {
        const sesion = localStorage.getItem("wms_session");
        if (!sesion) { window.location.href = "login.html"; }
        const btnLogout = document.querySelector('.btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                localStorage.removeItem("wms_session");
                window.location.href = "login.html";
            });
        }
    });

    // ⚠️ RECUERDA PEGAR AQUÍ TU URL ACTUALIZADA ⚠️
    const urlInventarios = "https://script.google.com/macros/s/AKfycbygzLV189IQqgsqjN_v5uBbyT2Gpuy5d1WPMMcsvE9_FzAEb4Wd4-K-Ex1BdyI8aFakOA/exec";

    const productos = [
        { cod: "A101", desc: "CAJA PASTICA NAYLEA" },
        { cod: "A202", desc: "CAJA IFCO 6413" },
        { cod: "A203", desc: "CAJA IFCO 6423" },
        { cod: "A301", desc: "CAJA CARTON GENERICA 40 LBS" },
        { cod: "A303", desc: "CAJA CARTON 1/2 BUSHEL" },
        { cod: "A304", desc: "CAJA CARTON 1/4 BUSHEL" },
        { cod: "A401", desc: "ESQUINEROS DE CARTON CAL 1.20" },
        { cod: "A402", desc: "ESQUINEROS DE CARTON CAL 1.70" },
        { cod: "A403", desc: "LAMINA DE CARTON KRAFT (P/TARIMA)" },
        { cod: "A905", desc: "TARIMA NACIONAL DE BARROTE RECICLADA" },
        { cod: "A502", desc: "TARIMA EXPORTACION DE CUBO PRIMERA C/SELLO" },
        { cod: "A505", desc: "TARIMA CUBO RECICLADA" },
        { cod: "A701", desc: "RAFIA BLANCA BOBINA GDE. (4KG)" },
        { cod: "A702", desc: "FLEJE PLASTICO VERDE LISO" },
        { cod: "A704", desc: "PELICULA PLASTICA STRETCH /EMPLAYE" },
        { cod: "A705", desc: "FLEJE PLASTICO 1/2 NEGRO" },
        { cod: "A801", desc: "RIBBON DE TINTA GRANDE ZEBRA (110MM X 300M)" },
        { cod: "A802", desc: "RIBBON DE TINTA CHICO ZEBRA (110MM X 74M)" },
        { cod: "A803", desc: "ETIQUETAS COLORES 8x4 (375 ETQ X ROLLO)" },
        { cod: "A804", desc: "ETIQUETAS BLANCAS 4x2 (3000 ETQ X ROLLO)" },
        { cod: "A805", desc: "ETIQUETAS BLANCAS 4x2 (1500 ETQ X ROLLO)" },
        { cod: "A103", desc: "CAJA PLASTICA MORELIA" },
        { cod: "A503", desc: "TARIMA SEGUNDA" },
        { cod: "A601", desc: "TARIMA REFORZADA AZUL" },
        { cod: "A904", desc: "CAJA LIMONERA" }
    ];

    const areasKeys = ['alm', 'prod', 'cf1', 'cf24', 'cf5', 'desc', 'huerto'];
    const oracleMap = {
        'alm': 'Monterrey : Mty - Almacen Indirectos',
        'prod': 'Monterrey : Mty - Producción',
        'cf1': 'Monterrey : Mty - Cuarto Frio 1 PT',
        'cf24': 'Monterrey : Mty - Almacén General MP CF2 a CF4',
        'cf5': 'Monterrey : Mty - Cuarto Frio 5 Tomatillo',
        'desc': 'Monterrey : Mty - Descargas',
        'huerto': 'Santa Catarina : SC - Almacen Indirectos'
    };

    const reverseOracleMap = {};
    for (let key in oracleMap) { reverseOracleMap[oracleMap[key]] = key; }

    window.onload = function() {
        document.getElementById('fecha-inventario').valueAsDate = new Date();
        construirFiltroInsumos();
        renderizarTabla();
        cargarMemoriaLocal();
        
        // El motor que revisa cada 5 segundos si hay cosas por guardar en la nube
        setInterval(sincronizarEnSegundoPlano, 5000);
    };

    function construirFiltroInsumos() {
        const select = document.getElementById('insumo-selector');
        productos.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p.cod;
            opt.textContent = p.desc;
            select.appendChild(opt);
        });
    }

    function renderizarTabla() {
        const tbody = document.getElementById('tabla-body');
        let html = '';

        productos.forEach((prod, index) => {
            html += `<tr data-index="${index}" id="row-${prod.cod}">
                        <td class="sticky-col col-codigo" title="${prod.cod}">${prod.cod}</td>
                        <td class="sticky-col col-producto" title="${prod.desc}">${prod.desc}</td>`;
            
            areasKeys.forEach(area => {
                html += `
                    <td class="area-group area-${area}">
                        <input type="number" class="in-fisico" data-area="${area}" oninput="calcularFila('${prod.cod}', '${area}')" onchange="registrarCambioAutoGuardado('${prod.cod}', '${area}')">
                    </td>
                    <td class="area-group area-${area}">
                        <input type="text" class="in-oracle" data-area="${area}" value="-" readonly tabindex="-1">
                    </td>
                    <td class="area-group area-${area}">
                        <span class="dif-result dif-ok" data-area="${area}">-</span>
                    </td>
                `;
            });

            html += `<td class="total-cell" id="total-${prod.cod}">0</td>
                     <td class="status-cell" id="status-${prod.cod}"></td>
                     </tr>`;
        });
        tbody.innerHTML = html;
    }

    function calcularFila(codigo, area) {
        const tr = document.getElementById(`row-${codigo}`);
        const fisicoInput = tr.querySelector(`.in-fisico[data-area="${area}"]`);
        const oracleInput = tr.querySelector(`.in-oracle[data-area="${area}"]`);
        const resultSpan = tr.querySelector(`.dif-result[data-area="${area}"]`);

        let fisicoVal = fisicoInput.value.trim() === "" ? null : parseFloat(fisicoInput.value);
        let oracleVal = oracleInput.value === "-" ? 0 : parseFloat(oracleInput.value);
        
        if (fisicoVal === null) {
            resultSpan.textContent = "-";
            resultSpan.className = "dif-result dif-ok";
        } else {
            let diferencia = fisicoVal - oracleVal;
            if (diferencia === 0) {
                resultSpan.textContent = "✔"; 
                resultSpan.className = "dif-result dif-ok";
            } else {
                let dispDif = diferencia % 1 !== 0 ? diferencia.toFixed(1) : diferencia;
                resultSpan.textContent = diferencia > 0 ? `+${dispDif}` : dispDif;
                resultSpan.className = "dif-result dif-alert";
            }
        }

        let sumaTotal = 0;
        const todosLosFisicos = tr.querySelectorAll('.in-fisico');
        todosLosFisicos.forEach(inp => {
            if(inp.value.trim() !== "") { sumaTotal += parseFloat(inp.value); }
        });
        document.getElementById(`total-${codigo}`).textContent = sumaTotal === 0 ? "0" : sumaTotal;
    }

    // === FILTROS ===
    function filtrarArea() {
        const seleccion = document.getElementById('area-selector').value;
        const container = document.getElementById('main-container');
        const todasLasAreasDOM = document.querySelectorAll('.area-group');
        
        todasLasAreasDOM.forEach(el => el.classList.remove('hidden-area'));

        if (seleccion !== 'todas') {
            container.classList.add('compact-view');
            todasLasAreasDOM.forEach(el => {
                if (!el.classList.contains(`area-${seleccion}`)) {
                    el.classList.add('hidden-area');
                }
            });
        } else {
            container.classList.remove('compact-view');
        }
    }

    function filtrarProducto() {
        const seleccion = document.getElementById('insumo-selector').value;
        productos.forEach(p => {
            const tr = document.getElementById(`row-${p.cod}`);
            if (seleccion === 'todos' || seleccion === p.cod) {
                tr.style.display = "";
            } else {
                tr.style.display = "none";
            }
        });
    }

    // === LÓGICA DE ORACLE (No auto-guarda por sí solo hasta que haya un físico) ===
    function procesarExcelOracle(event) {
        const file = event.target.files[0];
        if (!file) return;

        const badge = document.getElementById('oracle-status');
        badge.style.display = 'inline-block';
        badge.textContent = "Procesando...";
        badge.className = "status-badge";

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const jsonOracle = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
            
            const headersAreas = jsonOracle[6];
            const headersTipos = jsonOracle[7];
            
            let colIndexes = {};
            areasKeys.forEach(areaKey => {
                const oracleName = oracleMap[areaKey];
                const areaColIndex = headersAreas.findIndex(h => typeof h === 'string' && h.includes(oracleName));
                
                if(areaColIndex !== -1) {
                    for(let i = areaColIndex; i < areaColIndex + 10; i++) {
                        if(headersTipos[i] === "Físico") {
                            colIndexes[areaKey] = i;
                            break;
                        }
                    }
                }
            });

            for(let row = 8; row < jsonOracle.length; row++) {
                const rowData = jsonOracle[row];
                const articuloCod = String(rowData[0]).trim(); 

                if(articuloCod && articuloCod !== "") {
                    const tr = document.getElementById(`row-${articuloCod}`);
                    if(tr) {
                        areasKeys.forEach(areaKey => {
                            if(colIndexes[areaKey] !== undefined) {
                                let valorOracle = parseFloat(rowData[colIndexes[areaKey]]) || 0;
                                const inOracle = tr.querySelector(`.in-oracle[data-area="${areaKey}"]`);
                                
                                let displayVal = valorOracle % 1 !== 0 ? valorOracle.toFixed(1) : valorOracle;
                                inOracle.value = displayVal;
                                inOracle.classList.add('updated'); 
                                
                                calcularFila(articuloCod, areaKey);
                                // Si ya había un dato físico escrito, actualiza la diferencia y lo mete a la cola de guardado
                                const inFisico = tr.querySelector(`.in-fisico[data-area="${areaKey}"]`);
                                if(inFisico.value.trim() !== "") {
                                    registrarCambioAutoGuardado(articuloCod, areaKey);
                                }
                            }
                        });
                    }
                }
            }
            badge.textContent = `¡Cargado!`;
            badge.className = "status-badge loaded";
        };
        reader.readAsArrayBuffer(file);
    }

    // === MOTOR OFFLINE Y AUTO-GUARDADO SILENCIOSO ===
    
    let colaSincronizacion = JSON.parse(localStorage.getItem('wms_sync_queue')) || [];
    let memoriaPantalla = JSON.parse(localStorage.getItem('wms_pantalla_inv')) || {};

    function cargarMemoriaLocal() {
        const fecha = document.getElementById('fecha-inventario').value;
        
        productos.forEach(prod => {
            const tr = document.getElementById(`row-${prod.cod}`);
            const icon = document.getElementById(`status-${prod.cod}`);
            icon.innerHTML = "";

            areasKeys.forEach(area => {
                const input = tr.querySelector(`.in-fisico[data-area="${area}"]`);
                input.value = "";
                
                if(memoriaPantalla[fecha] && memoriaPantalla[fecha][prod.cod] && memoriaPantalla[fecha][prod.cod][area] !== undefined) {
                    input.value = memoriaPantalla[fecha][prod.cod][area];
                }
                calcularFila(prod.cod, area);
            });
        });
    }

    // Se dispara cada que escribes un número y pasas a la siguiente casilla (onchange)
    function registrarCambioAutoGuardado(codigo, areaKey) {
        const fecha = document.getElementById('fecha-inventario').value;
        const tr = document.getElementById(`row-${codigo}`);
        const fisicoInput = tr.querySelector(`.in-fisico[data-area="${areaKey}"]`);
        const oracleInput = tr.querySelector(`.in-oracle[data-area="${areaKey}"]`);
        const icon = document.getElementById(`status-${codigo}`);
        
        const prod = productos.find(p => p.cod === codigo);
        let fisicoVal = fisicoInput.value.trim();

        // 1. Respaldar en la memoria visual local (para que si recargan, sigan ahí)
        if(!memoriaPantalla[fecha]) memoriaPantalla[fecha] = {};
        if(!memoriaPantalla[fecha][codigo]) memoriaPantalla[fecha][codigo] = {};
        memoriaPantalla[fecha][codigo][areaKey] = fisicoVal;
        localStorage.setItem('wms_pantalla_inv', JSON.stringify(memoriaPantalla));

        // Si el usuario borró el número y la dejó vacía, no enviamos guardar de esto
        if(fisicoVal === "") {
            icon.innerHTML = "";
            return; 
        }

        let oracleVal = oracleInput.value === "-" ? 0 : parseFloat(oracleInput.value);
        let fisicoNum = parseFloat(fisicoVal);
        let diferencia = fisicoNum - oracleVal;
        let nombreArea = oracleMap[areaKey] || areaKey;

        icon.innerHTML = "⏳"; // Indicador visual en la fila de que se puso en cola

        let nuevoRegistro = {
            fecha: fecha,
            area: nombreArea,
            codigo: prod.cod,
            producto: prod.desc,
            fisico: fisicoNum,
            oracle: oracleVal,
            diferencia: diferencia,
            idFilaUI: codigo 
        };

        // Buscar si ya estaba en cola (por si lo corrigió antes de que el sistema lo enviara)
        let existeEnCola = colaSincronizacion.findIndex(item => item.fecha === fecha && item.producto === prod.desc && item.area === nombreArea);
        
        if(existeEnCola >= 0) {
            colaSincronizacion[existeEnCola] = nuevoRegistro;
        } else {
            colaSincronizacion.push(nuevoRegistro);
        }

        // Guardar la cola en el disco duro del navegador por si se va la luz
        localStorage.setItem('wms_sync_queue', JSON.stringify(colaSincronizacion));
        
        // Intentar enviarlo a Google
        sincronizarEnSegundoPlano();
    }

    let sincronizando = false;

    function sincronizarEnSegundoPlano() {
        if(sincronizando || colaSincronizacion.length === 0) return;

        sincronizando = true;
        const led = document.getElementById('led-conexion');
        const txt = document.getElementById('texto-conexion');
        
        led.className = "dot syncing";
        txt.textContent = "Guardando en la nube...";

        const payload = {
            action: "guardar_inventario_ind",
            registros: colaSincronizacion
        };

        fetch(urlInventarios, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            if(res.status === "success") {
                // Poner la palomita en todas las filas que se enviaron en este paquete
                colaSincronizacion.forEach(item => {
                    let icon = document.getElementById(`status-${item.idFilaUI}`);
                    if(icon) icon.innerHTML = "✅";
                });

                // Vaciamos la cola
                colaSincronizacion = [];
                localStorage.setItem('wms_sync_queue', JSON.stringify(colaSincronizacion));

                led.className = "dot";
                txt.textContent = "Sistema en línea (Guardado)";
            } else {
                marcarOffline();
            }
            sincronizando = false;
        })
        .catch(err => {
            marcarOffline();
            sincronizando = false;
        });
    }

    function marcarOffline() {
        const led = document.getElementById('led-conexion');
        const txt = document.getElementById('texto-conexion');
        led.className = "dot offline";
        txt.textContent = "Sin red (Guardando en el dispositivo)";

        // Pintamos el disquete de "Guardado Local" en las filas afectadas
        colaSincronizacion.forEach(item => {
            let icon = document.getElementById(`status-${item.idFilaUI}`);
            if(icon) icon.innerHTML = "💾";
        });
    }

    // === CARGAR DESDE GOOGLE SHEETS ===
    function buscarPorFecha() {
        const fechaInv = document.getElementById('fecha-inventario').value;
        if (!fechaInv) {
            alert("Por favor, selecciona una fecha primero.");
            return;
        }

        const badge = document.getElementById('oracle-status');
        badge.style.display = 'inline-block';
        badge.textContent = "Descargando nube...";
        badge.className = "status-badge";

        // Limpiamos pantalla
        document.querySelectorAll('.in-fisico').forEach(inp => inp.value = "");
        document.querySelectorAll('.in-oracle').forEach(inp => { inp.value = "-"; inp.classList.remove('updated'); });
        document.querySelectorAll('.status-cell').forEach(cell => cell.innerHTML = "");
        
        productos.forEach(prod => {
            areasKeys.forEach(area => calcularFila(prod.cod, area));
        });

        const fetchUrl = `${urlInventarios}?action=obtener_inventario_ind&fecha=${fechaInv}`;
        
        fetch(fetchUrl)
            .then(response => response.json())
            .then(data => {
                if(data.length === 0) {
                    badge.textContent = "Sin datos en la nube";
                    badge.className = "status-badge";
                    return;
                }

                // Cargar datos a la tabla y reescribir memoria local
                if(!memoriaPantalla[fechaInv]) memoriaPantalla[fechaInv] = {};

                data.forEach(registro => {
                    const cod = registro.codigo;
                    const areaKey = reverseOracleMap[registro.area] || registro.area;
                    
                    const tr = document.getElementById(`row-${cod}`);
                    if (tr) {
                        const inFisico = tr.querySelector(`.in-fisico[data-area="${areaKey}"]`);
                        const inOracle = tr.querySelector(`.in-oracle[data-area="${areaKey}"]`);
                        
                        if (inFisico && registro.fisico !== "") {
                            inFisico.value = registro.fisico;
                            // Sincronizar con la memoria local
                            if(!memoriaPantalla[fechaInv][cod]) memoriaPantalla[fechaInv][cod] = {};
                            memoriaPantalla[fechaInv][cod][areaKey] = registro.fisico;
                        }
                        
                        if (inOracle) {
                            let valOrc = parseFloat(registro.oracle) || 0;
                            inOracle.value = valOrc % 1 !== 0 ? valOrc.toFixed(1) : valOrc;
                            inOracle.classList.add('updated');
                        }
                        
                        calcularFila(cod, areaKey);
                        document.getElementById(`status-${cod}`).innerHTML = "☁️"; // Indicador de que vino de la nube
                    }
                });

                localStorage.setItem('wms_pantalla_inv', JSON.stringify(memoriaPantalla));
                badge.textContent = `¡Datos cargados!`;
                badge.className = "status-badge loaded";
            })
            .catch(error => {
                badge.textContent = "Error de conexión";
                badge.className = "status-badge";
            });
    }
</script>
