<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Vegxspress - Salidas a PT</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1F4E78; --background: #f4f7f6; --text: #333; --danger: #dc3545; --success: #28a745; --warning: #ffc107;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .offline-banner { width: 100%; max-width: 600px; background-color: var(--warning); color: #333; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; display: none; justify-content: space-between; align-items: center; box-sizing: border-box;}
        .sync-btn { background-color: #333; color: white; border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .nav-header { width: 100%; max-width: 600px; display: flex; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-btn { background-color: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--primary); color: white; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: var(--danger); margin-top: 0; }
        #reader-container { width: 100%; border-radius: 8px; overflow: hidden; background-color: #000; margin-bottom: 20px; } #reader { width: 100%; }
        .form-group { margin-bottom: 15px; } label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; box-sizing: border-box; text-align: center; font-weight: bold;}
        .submit-btn { background-color: var(--danger); color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px; transition: 0.3s;}
        .submit-btn:hover:not(:disabled) { background-color: #c82333; } .submit-btn:disabled { background-color: #999; cursor: not-allowed; }
        #status-area { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; }
        
        /* ESTILO DEL BOTÓN DE CERRAR SESIÓN FLOTANTE */
        .logout-btn {
            position: fixed; top: 15px; right: 15px; background-color: #dc3545; color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3); transition: 0.2s; z-index: 1000;
        }
        .logout-btn:hover { background-color: #c82333; transform: scale(1.05); }
    </style>
</head>
<body>

<!-- CANDADO DE SEGURIDAD -->
<script>
    const sesion = JSON.parse(localStorage.getItem('wms_session'));
    const rolPermitido = "Almacen";
    
    if (!sesion || (sesion.rol !== "Admin" && sesion.rol !== rolPermitido)) { window.location.href = "login.html"; }
    
    window.addEventListener('DOMContentLoaded', () => {
        if(sesion.rol !== "Admin") {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                if(txt !== "Almacenaje" && txt !== "Salidas" && txt !== "Ajustes / Reubicación") {
                    btn.style.display = 'none';
                }
            });
        }
        
        // Botón elegante flotante
        const btnSalir = document.createElement('button');
        btnSalir.className = 'logout-btn';
        btnSalir.innerHTML = `🚪 Cerrar Sesión (${sesion.nombre})`;
        btnSalir.onclick = () => {
            localStorage.removeItem('wms_session');
            window.location.href = "login.html";
        };
        document.body.appendChild(btnSalir);
    });
</script>

<div id="offlineBanner" class="offline-banner"><span id="offlineText">⚠️ Sin conexión: 0 salidas pendientes</span><button class="sync-btn" onclick="sincronizarDatos()">Sincronizar</button></div>

<div class="nav-header">
    <a href="index.html" class="nav-btn">Recepción</a>
    <a href="almacen.html" class="nav-btn">Almacenaje</a>
    <a href="salidas.html" class="nav-btn active">Salidas</a>
    <a href="ajustes.html" class="nav-btn">Ajustes / Reubicación</a>
    <a href="rastreador.html" class="nav-btn">Rastreador</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <h2>Despacho a PT</h2>
    <div id="reader-container"><div id="reader"></div></div>
    <form id="salidaForm">
        <div class="form-group"><label>Escanea el Folio para dar Salida:</label><input type="text" id="folioDisplay" placeholder="EJ: 7085C-1" required autocomplete="off"></div>
        <button type="submit" id="saveBtn" class="submit-btn" disabled>Confirmar Salida a PT</button>
    </form>
    <div id="status-area"></div>
</div>

<script>
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbz3tj3SCSLVqxwQX3ameGZ-HzDX70QTKrqj8tuH_j31QZqnM0WX7GFlvMY83-8U3UHuLQ/exec";
    let buzonsalida = JSON.parse(localStorage.getItem('wms_salidas_offline')) || [];

    window.addEventListener('load', () => { iniciarCamara(); actualizarInterfazOffline(); document.getElementById('folioDisplay').focus(); });

    function actualizarInterfazOffline() {
        const banner = document.getElementById('offlineBanner');
        if (buzonsalida.length > 0) { banner.style.display = 'flex'; document.getElementById('offlineText').innerText = `⚠️ Sin conexión: ${buzonsalida.length} salidas pendientes`;
        } else { banner.style.display = 'none'; }
    }

    window.addEventListener('online', sincronizarDatos);
    async function sincronizarDatos() {
        if (buzonsalida.length === 0) return; if (!navigator.onLine) { alert("Aún no tienes conexión."); return; }
        document.getElementById('offlineText').innerText = "🔄 Sincronizando salidas...";
        let pendientes = [];
        for (let i = 0; i < buzonsalida.length; i++) {
            try { await fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buzonsalida[i]) });
            } catch (error) { pendientes.push(buzonsalida[i]); }
        }
        buzonsalida = pendientes; localStorage.setItem('wms_salidas_offline', JSON.stringify(buzonsalida)); actualizarInterfazOffline();
    }

    document.getElementById('folioDisplay').addEventListener('input', function() { document.getElementById('saveBtn').disabled = this.value.trim() === ""; });

    const html5QrCode = new Html5Qrcode("reader");
    function iniciarCamara() {
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) { html5QrCode.start({ facingMode: "environment" }, { fps: 30, qrbox: { width: 250, height: 100 } }, text => {
                document.getElementById('folioDisplay').value = text; document.getElementById('saveBtn').disabled = false;
                document.getElementById('salidaForm').dispatchEvent(new Event('submit'));
                setTimeout(() => { document.getElementById('folioDisplay').value = ""; }, 1500);
            }); }
        });
    }

    document.getElementById('salidaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const folio = document.getElementById('folioDisplay').value.trim();
        const datos = { 
            action: 'salida_produccion', 
            folio: folio,
            operador: sesion.nombre 
        };

        const statusArea = document.getElementById('status-area');
        statusArea.innerHTML = `<span style='color:var(--danger)'>¡Folio ${folio} enviado a PT!</span>`;
        document.getElementById('salidaForm').reset(); document.getElementById('saveBtn').disabled = true; document.getElementById('folioDisplay').focus();

        fetch(urlGoogleScript, { method: 'POST', mode: 'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos) })
        .then(() => { setTimeout(() => { statusArea.innerHTML = ""; }, 2500);
        }).catch(() => { buzonsalida.push(datos); localStorage.setItem('wms_salidas_offline', JSON.stringify(buzonsalida)); actualizarInterfazOffline(); statusArea.innerHTML += "<br><span style='font-size:14px; color:#ffc107'>Guardado localmente.</span>"; });
    });
</script>
</body>
</html>
